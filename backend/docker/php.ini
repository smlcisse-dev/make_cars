; Réglages PHP de production (Dockerfile).

memory_limit = 192M
max_execution_time = 60
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Envoi de fichiers : justificatifs jusqu'à 10 Mo, plusieurs fichiers par
; requête (PASSATION.md §4, « Limites PHP d'envoi de fichiers »). Même
; limite côté nginx (client_max_body_size).
upload_max_filesize = 12M
post_max_size = 50M

; OPcache : code compilé gardé en mémoire. validate_timestamps = 0 : aucune
; vérification des fichiers à chaque requête (le code ne change jamais dans
; un conteneur ; un déploiement crée un nouveau conteneur).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 96
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.jit = off

realpath_cache_size = 4096K
realpath_cache_ttl = 600
