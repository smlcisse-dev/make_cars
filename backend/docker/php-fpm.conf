; Pool PHP-FPM de production (Dockerfile), après les réglages de l'image.
[www]
; Nombre fixe de processus : mémoire prévisible sous 512 Mo, aucun
; démarrage de processus pendant une requête. 4 requêtes en parallèle : le
; temps se passe surtout à attendre Supabase, pas à calculer.
pm = static
pm.max_children = 4
; Recyclage régulier des processus (protection contre une fuite mémoire).
pm.max_requests = 500

; Garder les variables d'environnement de Render (DB_*, APP_KEY…).
clear_env = no

; Pas de journal par requête (Render compte déjà les requêtes).
access.log = /dev/null

catch_workers_output = yes
decorate_workers_output = no
