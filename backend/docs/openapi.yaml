openapi: 3.0.3
info:
  title: Make Cars API
  description: >
    API REST unique consommée par la SPA web (Admin / Garagiste / Market Space)
    et par l'application mobile Flutter (automobilistes). Voir /CLAUDE.md à la
    racine du projet pour le contexte métier et les règles de gestion.
  version: 0.3.0

servers:
  - url: http://localhost:8000/api
    description: Développement local

tags:
  - name: Auth
    description: Inscription, connexion, gestion des tokens (Laravel Sanctum).
  - name: Admin
    description: Endpoints réservés au dashboard Administrateur.
  - name: Garage
    description: Endpoints du dashboard Garagiste (compte Garagiste requis).
  - name: MarketSpace
    description: Endpoints du dashboard Market Space (compte Market Space requis).
  - name: Mobile
    description: Endpoints consommés par l'application mobile (automobilistes).

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
      description: "Token d'API Laravel Sanctum, envoyé en en-tête Authorization: Bearer <token>."

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          nullable: true
          description: >
            Nullable en base pour de futurs flux sans email (CLAUDE.md §7),
            mais toujours obligatoire pour l'inscription classique et pour la
            création d'un compte "express" (ajout v0.9).
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [automobiliste, garagiste, market_space, admin]
        role_label:
          type: string
        is_express:
          type: boolean
          description: >
            Compte automobiliste créé par un garagiste pour un client
            walk-in sans app, pas encore "réclamé" par son propriétaire réel
            (CLAUDE.md §5, ajout v0.9 ; §7 point ouvert).
        professional_registration:
          $ref: '#/components/schemas/ProfessionalRegistration'

    ProfessionalRegistration:
      type: object
      nullable: true
      properties:
        id:
          type: integer
        structure_name:
          type: string
        address:
          type: string
        business_registration_number:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        rejection_reason:
          type: string
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        documents:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              type:
                type: string
                enum: [business_registration, premises_photo]
              download_url:
                type: string
        created_at:
          type: string
          format: date-time
        is_suspended:
          type: boolean
          description: >
            Compte déjà approuvé mais suspendu par un admin (fraude, plaintes,
            pièces de mauvaise qualité) — invisible côté mobile tant que suspendu,
            réversible (CLAUDE.md §5, ajout v0.6). N'affecte pas "status" ci-dessus.
        suspension_reason:
          type: string
          nullable: true
        suspended_at:
          type: string
          format: date-time
          nullable: true

    AuthPayload:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            token:
              type: string
        message:
          type: string

    Garage:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: string, nullable: true}
        address: {type: string}
        city:
          type: string
          nullable: true
          description: "Liste fixe App\\Enums\\City (CLAUDE.md §5, ajout v0.17)."
        city_label: {type: string, nullable: true}
        region:
          type: string
          nullable: true
          description: "Liste fixe App\\Enums\\Region, départements du Bénin (CLAUDE.md §5, ajout v0.17)."
        region_label: {type: string, nullable: true}
        latitude: {type: number, format: float, nullable: true}
        longitude: {type: number, format: float, nullable: true}
        phone: {type: string, nullable: true}
        is_publicly_visible:
          type: boolean
          description: Reflète la validation admin du compte Garagiste (CLAUDE.md §5 règle 4), pas un champ propre au garage.
        opening_hours:
          type: array
          items:
            type: object
            properties:
              day_of_week: {type: integer, minimum: 1, maximum: 7, description: "ISO-8601 : 1 = lundi ... 7 = dimanche"}
              day_label: {type: string}
              is_closed: {type: boolean}
              opens_at: {type: string, nullable: true, example: "08:00"}
              closes_at: {type: string, nullable: true, example: "18:00"}
        images:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              url: {type: string}
              position: {type: integer}
        products:
          type: array
          items: {$ref: '#/components/schemas/Product'}
          description: Mini-boutique du garage — uniquement les produits "approved" hors dashboard Garagiste (CLAUDE.md §5, ajout v0.4).
        services:
          type: array
          items: {$ref: '#/components/schemas/Service'}
          description: Uniquement les services "approved" et actifs hors dashboard Garagiste (CLAUDE.md §5, ajout v0.6).

    MarketSpaceAccount:
      type: object
      description: >
        Même structure de profil que Garage (module Profil Market Space,
        ajout v0.10).
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: string, nullable: true}
        address: {type: string}
        city:
          type: string
          nullable: true
          description: "Liste fixe App\\Enums\\City (CLAUDE.md §5, ajout v0.17)."
        city_label: {type: string, nullable: true}
        region:
          type: string
          nullable: true
          description: "Liste fixe App\\Enums\\Region, départements du Bénin (CLAUDE.md §5, ajout v0.17)."
        region_label: {type: string, nullable: true}
        latitude: {type: number, format: float, nullable: true}
        longitude: {type: number, format: float, nullable: true}
        phone: {type: string, nullable: true}
        is_publicly_visible:
          type: boolean
          description: Reflète la validation admin ET l'absence de suspension du compte Market Space (CLAUDE.md §5 règle 4, ajout v0.6).
        opening_hours:
          type: array
          items:
            type: object
            properties:
              day_of_week: {type: integer, minimum: 1, maximum: 7, description: "ISO-8601 : 1 = lundi ... 7 = dimanche"}
              day_label: {type: string}
              is_closed: {type: boolean}
              opens_at: {type: string, nullable: true, example: "08:00"}
              closes_at: {type: string, nullable: true, example: "18:00"}
        images:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              url: {type: string}
              position: {type: integer}
        products:
          type: array
          items: {$ref: '#/components/schemas/Product'}

    Product:
      type: object
      description: >
        Un seul vendeur par produit : mini-boutique Garage OU Market Space,
        jamais les deux (relation polymorphe côté backend — CLAUDE.md §5, ajout v0.4).
      properties:
        id: {type: integer}
        sellable_type: {type: string, enum: [garage, market_space]}
        sellable_id: {type: integer}
        name: {type: string}
        description: {type: string, nullable: true}
        sku: {type: string, nullable: true}
        price: {type: string, description: "Décimal sérialisé en chaîne, ex. \"15000.00\"."}
        stock_quantity: {type: integer}
        status: {type: string, enum: [pending, approved, rejected]}
        rejection_reason: {type: string, nullable: true}
        is_publicly_visible:
          type: boolean
          description: "status == approved ET compte vendeur validé/non suspendu."
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    Service:
      type: object
      description: >
        Service de réparation, toujours rattaché à un Garage (jamais au Market
        Space), prix fixe unique — CLAUDE.md §5, ajout v0.6.
      properties:
        id: {type: integer}
        garage_id: {type: integer}
        name: {type: string}
        description: {type: string}
        category:
          type: string
          enum: [entretien_courant, freinage_suspension, pneumatiques, electricite_electronique, climatisation_refroidissement, carrosserie, diagnostic_controle, autre_divers]
        category_label: {type: string}
        price: {type: string, description: "Décimal sérialisé en chaîne, ex. \"15000.00\"."}
        duration_minutes: {type: integer}
        image_url: {type: string, nullable: true}
        is_active:
          type: boolean
          description: Disponibilité gérée par le garagiste, distincte de "status" (validation admin) — CLAUDE.md §5, ajout v0.6.
        status: {type: string, enum: [pending, approved, rejected]}
        rejection_reason: {type: string, nullable: true}
        is_publicly_visible:
          type: boolean
          description: "status == approved ET is_active == true ET garage validé/non suspendu."
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    Appointment:
      type: object
      description: >
        Premier maillon de la chaîne RDV → devis → validation → prestation →
        paiement → facture (CLAUDE.md §5 règle 10, ajout v0.7). Ne déclenche
        jamais de paiement.
      properties:
        id: {type: integer}
        garage_id: {type: integer}
        user_id: {type: integer, description: Automobiliste demandeur.}
        repair_service_id: {type: integer, nullable: true}
        description: {type: string, nullable: true}
        requested_at:
          type: string
          format: date-time
          description: Date/heure initialement proposée par l'automobiliste.
        proposed_at:
          type: string
          format: date-time
          nullable: true
          description: Contre-proposition du garagiste (statut "rescheduled" uniquement).
        confirmed_at:
          type: string
          format: date-time
          nullable: true
          description: Date/heure retenue une fois le RDV "confirmed" (= requested_at ou proposed_at accepté).
        status:
          type: string
          enum: [pending, confirmed, rejected, rescheduled, cancelled, completed]
          description: "\"completed\" est déclenché par le module Devis (mark-paid ou abandon — CLAUDE.md §5, ajout v0.8), dans les deux cas de clôture."
        rejection_reason: {type: string, nullable: true}
        garage: {$ref: '#/components/schemas/Garage'}
        repair_service: {$ref: '#/components/schemas/Service'}
        user: {$ref: '#/components/schemas/User'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    QuoteLine:
      type: object
      description: >
        Libellé et prix figés au moment de l'ajout (snapshot) — jamais
        recalculés depuis le catalogue après coup (CLAUDE.md §5, ajout v0.8).
      properties:
        id: {type: integer}
        type: {type: string, enum: [diagnosis_fee, service, product]}
        repair_service_id: {type: integer, nullable: true}
        product_id: {type: integer, nullable: true}
        label: {type: string}
        unit_price: {type: string, description: "Décimal sérialisé en chaîne."}
        quantity: {type: integer}
        line_total: {type: string, description: "Décimal sérialisé en chaîne."}

    QuoteVersion:
      type: object
      description: >
        Instantané figé d'un tour de négociation — chaque version a son
        propre PDF, jamais réécrit (CLAUDE.md §5, ajout v0.8).
      properties:
        id: {type: integer}
        quote_id: {type: integer}
        version: {type: integer}
        document_type: {type: string, enum: [quote, invoice]}
        is_sent: {type: boolean, description: "false = brouillon, encore modifiable."}
        sent_at: {type: string, format: date-time, nullable: true}
        decision: {type: string, enum: [accepted, rejected], nullable: true}
        decided_at: {type: string, format: date-time, nullable: true}
        total: {type: string, description: "Somme des lignes, décimal sérialisé en chaîne."}
        lines:
          type: array
          items: {$ref: '#/components/schemas/QuoteLine'}
        created_at: {type: string, format: date-time}

    Quote:
      type: object
      description: >
        Un devis est nécessaire dès qu'il y a une prestation, avec ou sans
        RDV préalable (CLAUDE.md §5 règle 10, ajout v0.9) : garage_id/user_id
        référencent directement le garage et le client, appointment_id n'est
        plus qu'un lien de traçabilité optionnel. Un seul Quote par
        Appointment quand ce lien existe ; la renégociation crée des
        QuoteVersion.
      properties:
        id: {type: integer}
        garage_id: {type: integer}
        user_id: {type: integer, description: "Client (automobiliste), éventuellement un compte \"express\" — CLAUDE.md §5, ajout v0.9."}
        appointment_id: {type: integer, nullable: true}
        status:
          type: string
          enum: [draft, sent, accepted, rejected, negotiating, in_progress, invoiced, abandoned]
        paid_at: {type: string, format: date-time, nullable: true}
        garage: {$ref: '#/components/schemas/Garage'}
        client: {$ref: '#/components/schemas/User'}
        versions:
          type: array
          items: {$ref: '#/components/schemas/QuoteVersion'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    OrderLine:
      type: object
      description: >
        Toujours un produit au prix déjà fixé au catalogue — un achat isolé
        n'a par définition aucune ligne de service (CLAUDE.md §5, ajout v0.9).
      properties:
        id: {type: integer}
        product_id: {type: integer}
        label: {type: string}
        unit_price: {type: string, description: "Décimal sérialisé en chaîne."}
        quantity: {type: integer}
        line_total: {type: string, description: "Décimal sérialisé en chaîne."}

    Order:
      type: object
      description: >
        Achat isolé de pièces/produits, sans aucune prestation associée
        (CLAUDE.md §5, règle 11 et ajout v0.9) : commande → paiement
        immédiat → facture, jamais de devis ni de négociation. Relation
        polymorphe "sellable" mutualisée avec Product (mini-boutique Garage
        ou Market Space).
      properties:
        id: {type: integer}
        sellable_type: {type: string, enum: [garage, market_space]}
        sellable_id: {type: integer}
        user_id: {type: integer}
        status: {type: string, enum: [pending, paid, cancelled]}
        paid_at: {type: string, format: date-time, nullable: true}
        total: {type: string, description: "Somme des lignes, décimal sérialisé en chaîne."}
        lines:
          type: array
          items: {$ref: '#/components/schemas/OrderLine'}
        client: {$ref: '#/components/schemas/User'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    Message:
      type: object
      properties:
        id: {type: integer}
        conversation_id: {type: integer}
        is_system:
          type: boolean
          description: "true pour un message posté automatiquement (devis/facture générés) — sender est alors null."
        sender: {$ref: '#/components/schemas/User'}
        body: {type: string, nullable: true}
        has_image: {type: boolean}
        attachment_type:
          type: string
          nullable: true
          enum: [quote_pdf, order_pdf]
          description: Message système avec devis/facture (ou facture de commande — CLAUDE.md §5, ajout v0.9) en pièce jointe (téléchargée via l'endpoint dédié, pas dupliquée).
        quote_version_id: {type: integer, nullable: true}
        order_id: {type: integer, nullable: true}
        created_at: {type: string, format: date-time}

    Conversation:
      type: object
      description: >
        Tous les échanges entre UN garage et UN automobiliste, indépendamment
        de tout RDV précis — un seul canal par paire (CLAUDE.md §5, ajout v0.8).
      properties:
        id: {type: integer}
        garage_id: {type: integer}
        user_id: {type: integer}
        last_message_at: {type: string, format: date-time, nullable: true}
        garage: {$ref: '#/components/schemas/Garage'}
        user: {$ref: '#/components/schemas/User'}
        messages:
          type: array
          items: {$ref: '#/components/schemas/Message'}

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Vérifie que l'API est disponible.
      tags: [Auth]
      security: []
      responses:
        '200':
          description: L'API répond correctement.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  app:
                    type: string

  /quotes/{quote}/versions/{version}/email-decision/accept:
    get:
      summary: >
        Accepte un devis via le lien signé reçu par email par un client
        "compte express" sans app (CLAUDE.md §5, ajout v0.9). Route publique
        protégée par signature+expiration (pas de Sanctum) : à usage limité,
        7 jours, une seule décision possible par version.
      tags: [Auth]
      security: []
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
        - name: version
          in: path
          required: true
          schema: {type: integer}
        - name: signature
          in: query
          required: true
          schema: {type: string}
        - name: expires
          in: query
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Devis accepté. Réponse JSON brute (API REST pure — CLAUDE.md §4) ; une page de confirmation sera ajoutée par le futur frontend Vue, sans changement côté backend.
        '403':
          description: Signature invalide/expirée, ou version pas envoyée/plus la version courante/devis plus en attente de décision.

  /quotes/{quote}/versions/{version}/email-decision/reject:
    get:
      summary: Refuse un devis via le lien signé reçu par email (mêmes garde-fous que l'acceptation).
      tags: [Auth]
      security: []
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
        - name: version
          in: path
          required: true
          schema: {type: integer}
        - name: signature
          in: query
          required: true
          schema: {type: string}
        - name: expires
          in: query
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Devis refusé.
        '403':
          description: Signature invalide/expirée, ou version pas envoyée/plus la version courante/devis plus en attente de décision.

  /auth/register/automobiliste:
    post:
      summary: Inscription d'un automobiliste (aucune validation admin requise).
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: {type: string}
                email: {type: string}
                phone: {type: string, nullable: true}
                password: {type: string}
                password_confirmation: {type: string}
      responses:
        '201':
          description: Compte créé, token émis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
        '422':
          description: Erreur de validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register/professionnel:
    post:
      summary: >
        Inscription d'un compte Garagiste ou Market Space avec justificatifs.
        Le compte est créé immédiatement (token émis) mais reste en attente de
        validation admin — aucun service/produit ne sera publiable tant que le
        statut n'est pas "approved" (CLAUDE.md §5, règle 4).
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name, email, password, password_confirmation, account_type
                - structure_name, address, business_registration_number
                - business_registration_document, premises_photos
              properties:
                name: {type: string}
                email: {type: string}
                phone: {type: string, nullable: true}
                password: {type: string}
                password_confirmation: {type: string}
                account_type: {type: string, enum: [garagiste, market_space]}
                structure_name: {type: string}
                address: {type: string}
                business_registration_number: {type: string}
                business_registration_document: {type: string, format: binary}
                premises_photos:
                  type: array
                  items: {type: string, format: binary}
      responses:
        '201':
          description: Dossier créé, en attente de validation admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
        '422':
          description: Erreur de validation.

  /auth/login:
    post:
      summary: Connexion (tout type de compte).
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string}
                password: {type: string}
      responses:
        '200':
          description: Connexion réussie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
        '422':
          description: Identifiants invalides.

  /auth/login/google:
    post:
      summary: >
        Connexion Google — réservée aux automobilistes (CLAUDE.md §5, ajout
        v0.5). Flux mobile natif : l'app Flutter fait le Google Sign-In
        elle-même et transmet l'ID token ici, pas de redirection navigateur.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token:
                  type: string
                  description: ID token (JWT) renvoyé par le SDK Google Sign-In côté app.
      responses:
        '200':
          description: Connexion réussie (compte automobiliste créé au besoin).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
        '422':
          description: >
            Jeton invalide/expiré/mal destiné, email non vérifié, ou email
            déjà utilisé par un compte professionnel (jamais rattaché à Google).

  /auth/express-claim:
    post:
      summary: >
        Réclamation d'un compte "express" par son propriétaire réel
        (CLAUDE.md §5, ajout v0.17) : envoie un email avec un lien signé
        permettant de définir un mot de passe. Ré-appelable tant que le
        compte reste "express" (non encore réclamé).
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string}
      responses:
        '200':
          description: Email envoyé (si un compte express correspond à cet email).
        '422':
          description: Aucun compte express en attente de réclamation ne correspond à cet email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /express-clients/{user}/claim:
    get:
      summary: >
        Confirme la validité du lien signé reçu par email (CLAUDE.md §5,
        ajout v0.17). Route publique protégée par signature+expiration (pas
        de Sanctum), 7 jours. Réponse JSON brute (API REST pure — CLAUDE.md
        §4) ; une page de confirmation sera ajoutée par le futur frontend
        Vue, sans changement côté backend.
      tags: [Auth]
      security: []
      parameters:
        - name: user
          in: path
          required: true
          schema: {type: integer}
        - name: signature
          in: query
          required: true
          schema: {type: string}
        - name: expires
          in: query
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Lien valide, compte encore "express".
        '403':
          description: Signature invalide/expirée.
        '409':
          description: Ce compte a déjà été réclamé.
    post:
      summary: >
        Définit le mot de passe du compte "express" et le fait basculer vers
        un compte automobiliste classique (`is_express` repasse à false).
        Utilise la même URL signée que GET ci-dessus — la vérification
        Laravel d'un lien signé ne porte que sur l'URL, pas sur la méthode
        HTTP (CLAUDE.md §5, ajout v0.17).
      tags: [Auth]
      security: []
      parameters:
        - name: user
          in: path
          required: true
          schema: {type: integer}
        - name: signature
          in: query
          required: true
          schema: {type: string}
        - name: expires
          in: query
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, password_confirmation]
              properties:
                password: {type: string}
                password_confirmation: {type: string}
      responses:
        '200':
          description: Mot de passe défini, compte réclamé.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '403':
          description: Signature invalide/expirée.
        '409':
          description: Ce compte a déjà été réclamé.
        '422':
          description: Erreur de validation (mot de passe).

  /auth/me:
    get:
      summary: Profil de l'utilisateur authentifié.
      tags: [Auth]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'

  /auth/logout:
    post:
      summary: Révoque le token courant.
      tags: [Auth]
      responses:
        '200':
          description: Déconnexion réussie.

  /admin/registrations:
    get:
      summary: Liste les dossiers d'inscription professionnelle (admin uniquement).
      tags: [Admin]
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [pending, approved, rejected]}
      responses:
        '200':
          description: Liste paginée (enveloppe standard Laravel data/links/meta).
        '403':
          description: Réservé aux administrateurs.

  /admin/registrations/{registration}:
    get:
      summary: Détail d'un dossier d'inscription.
      tags: [Admin]
      parameters:
        - name: registration
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK
        '403':
          description: Non autorisé (ni admin, ni propriétaire du dossier).

  /admin/registrations/{registration}/documents/{document}:
    get:
      summary: Télécharge un justificatif KYC (registre de commerce ou photo du local).
      tags: [Admin]
      parameters:
        - name: registration
          in: path
          required: true
          schema: {type: integer}
        - name: document
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Fichier binaire du justificatif.
        '403':
          description: Non autorisé (ni admin, ni propriétaire du dossier).
        '404':
          description: Document introuvable ou n'appartenant pas à ce dossier.

  /admin/registrations/{registration}/approve:
    post:
      summary: Valide un dossier en attente (CLAUDE.md §5, règle 4).
      tags: [Admin]
      parameters:
        - name: registration
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Dossier validé.
        '403':
          description: Réservé aux administrateurs, ou dossier déjà traité.

  /admin/registrations/{registration}/reject:
    post:
      summary: Rejette un dossier en attente, avec motif obligatoire.
      tags: [Admin]
      parameters:
        - name: registration
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
      responses:
        '200':
          description: Dossier rejeté.
        '422':
          description: Motif manquant.

  /admin/registrations/{registration}/suspend:
    post:
      summary: >
        Suspend un compte déjà validé (fraude, plaintes, pièces de mauvaise
        qualité), motif obligatoire — CLAUDE.md §5, ajout v0.6. Le statut
        d'inscription reste "approved" ; seule la visibilité mobile est coupée.
      tags: [Admin]
      parameters:
        - name: registration
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
      responses:
        '200':
          description: Compte suspendu.
        '403':
          description: Réservé aux administrateurs, compte pas encore validé, ou déjà suspendu.
        '422':
          description: Motif manquant.

  /admin/registrations/{registration}/reactivate:
    post:
      summary: Réactive un compte suspendu (aucun motif requis) — CLAUDE.md §5, ajout v0.6.
      tags: [Admin]
      parameters:
        - name: registration
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Compte réactivé.
        '403':
          description: Réservé aux administrateurs, ou compte pas suspendu.

  /admin/garages:
    get:
      summary: Liste tous les garages, validés ou non (supervision admin).
      tags: [Admin]
      responses:
        '200':
          description: Liste paginée.

  /admin/garages/{garage}:
    get:
      summary: Détail d'un garage (supervision admin).
      tags: [Admin]
      parameters:
        - name: garage
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK

  /admin/products:
    get:
      summary: Liste les produits (mini-boutique Garage ou Market Space), tous statuts.
      tags: [Admin]
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [pending, approved, rejected]}
      responses:
        '200':
          description: Liste paginée.
        '403':
          description: Réservé aux administrateurs.

  /admin/products/{product}:
    get:
      summary: Détail d'un produit (supervision admin).
      tags: [Admin]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK

  /admin/products/{product}/approve:
    post:
      summary: Valide un produit en attente (CLAUDE.md §5, règle 5).
      tags: [Admin]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Produit validé.
        '403':
          description: Réservé aux administrateurs, ou produit déjà traité.

  /admin/products/{product}/reject:
    post:
      summary: Rejette un produit en attente, avec motif obligatoire.
      tags: [Admin]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
      responses:
        '200':
          description: Produit rejeté.
        '422':
          description: Motif manquant.

  /admin/services:
    get:
      summary: Liste les services de réparation, tous garages et statuts confondus.
      tags: [Admin]
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [pending, approved, rejected]}
      responses:
        '200':
          description: Liste paginée.
        '403':
          description: Réservé aux administrateurs.

  /admin/services/{service}:
    get:
      summary: Détail d'un service (supervision admin).
      tags: [Admin]
      parameters:
        - name: service
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK

  /admin/services/{service}/approve:
    post:
      summary: Valide un service en attente (CLAUDE.md §5, règle 5).
      tags: [Admin]
      parameters:
        - name: service
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Service validé.
        '403':
          description: Réservé aux administrateurs, ou service déjà traité.

  /admin/services/{service}/reject:
    post:
      summary: Rejette un service en attente, avec motif obligatoire.
      tags: [Admin]
      parameters:
        - name: service
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
      responses:
        '200':
          description: Service rejeté.
        '422':
          description: Motif manquant.

  /admin/appointments:
    get:
      summary: >
        Liste tous les RDV, tous garages confondus — supervision en lecture
        seule (CLAUDE.md §5 règle 8, ajout v0.7). Aucune action de
        confirmation/refus/reprogrammation côté admin.
      tags: [Admin]
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [pending, confirmed, rejected, rescheduled, cancelled, completed]}
        - name: garage_id
          in: query
          schema: {type: integer}
      responses:
        '200':
          description: Liste paginée.
        '403':
          description: Réservé aux administrateurs.

  /admin/appointments/{appointment}:
    get:
      summary: Détail d'un RDV (supervision admin).
      tags: [Admin]
      parameters:
        - name: appointment
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK

  /admin/quotes:
    get:
      summary: Liste tous les devis/factures, tous garages et statuts confondus — supervision en lecture seule (CLAUDE.md §5 règle 8, ajout v0.8).
      tags: [Admin]
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [draft, sent, accepted, rejected, negotiating, in_progress, invoiced, abandoned]}
      responses:
        '200':
          description: Liste paginée.

  /admin/quotes/{quote}:
    get:
      summary: Détail d'un devis (supervision admin), avec toutes ses versions et lignes.
      tags: [Admin]
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK

  /admin/orders:
    get:
      summary: Liste toutes les commandes, tous vendeurs et statuts confondus — supervision en lecture seule (CLAUDE.md §5 règle 8, ajout v0.9).
      tags: [Admin]
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [pending, paid, cancelled]}
      responses:
        '200':
          description: Liste paginée.

  /admin/orders/{order}:
    get:
      summary: Détail d'une commande (supervision admin), avec ses lignes.
      tags: [Admin]
      parameters:
        - name: order
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK

  /admin/conversations:
    get:
      summary: Liste toutes les conversations — supervision en lecture seule (CLAUDE.md §5 règle 8, ajout v0.8).
      tags: [Admin]
      responses:
        '200':
          description: Liste paginée, triée par dernier message.

  /admin/conversations/{conversation}:
    get:
      summary: Détail d'une conversation (supervision admin), avec tous ses messages.
      tags: [Admin]
      parameters:
        - name: conversation
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK

  /admin/reviews:
    get:
      summary: >
        Liste tous les avis, tous statuts confondus (y compris masqués) —
        supervision en lecture seule (CLAUDE.md §5 règle 8, ajout v0.10).
      tags: [Admin]
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [visible, hidden]}
        - name: reviewable_type
          in: query
          schema: {type: string, enum: [garage, market_space]}
      responses:
        '200':
          description: Liste paginée.

  /admin/reviews/{review}:
    get:
      summary: Détail d'un avis (supervision admin).
      tags: [Admin]
      parameters:
        - name: review
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK

  /admin/reviews/{review}/moderate:
    post:
      summary: >
        Masque un avis abusif/diffamatoire — motif obligatoire, comme pour un
        rejet/une suspension de compte. Masquage logique tracé (motif,
        auteur, date), jamais une suppression SQL, pour garder la preuve de
        la modération elle-même (CLAUDE.md §5, ajout v0.10).
      tags: [Admin]
      parameters:
        - name: review
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 1000}
      responses:
        '200':
          description: Avis masqué.
        '403':
          description: Cet avis est déjà masqué.
        '422':
          description: Motif manquant.

  /admin/disputes:
    get:
      summary: Liste toutes les réclamations, filtrable par statut — supervision admin (CLAUDE.md §5, ajout v0.11).
      tags: [Admin]
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [submitted, under_review, resolved_founded, resolved_rejected, closed]}
      responses:
        '200':
          description: Liste paginée.

  /admin/disputes/{dispute}:
    get:
      summary: >
        Instruction du dossier : la réclamation, la transaction concernée,
        la conversation de chat Garage↔Automobiliste associée (quand elle
        existe) et les avis déjà laissés sur le professionnel visé — tout
        l'historique lié nécessaire pour trancher (CLAUDE.md §5, ajout v0.11).
      tags: [Admin]
      parameters:
        - name: dispute
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK — objet avec les clés "dispute", "conversation" (nullable) et "reviews".

  /admin/disputes/{dispute}/request-response:
    post:
      summary: >
        Demande une réponse/défense au professionnel — optionnelle, l'admin
        peut trancher directement si les preuves jointes suffisent.
      tags: [Admin]
      parameters:
        - name: dispute
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message: {type: string, maxLength: 2000, nullable: true}
      responses:
        '200':
          description: Réponse demandée au professionnel.
        '403':
          description: Une réponse a déjà été demandée, ou le dossier est déjà tranché.

  /admin/disputes/{dispute}/reject:
    post:
      summary: Rejette (classe sans suite) une réclamation — motif obligatoire (CLAUDE.md §5, ajout v0.11).
      tags: [Admin]
      parameters:
        - name: dispute
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 1000}
      responses:
        '200':
          description: Réclamation rejetée.
        '403':
          description: Cette réclamation est déjà tranchée.
        '422':
          description: Motif manquant.

  /admin/disputes/{dispute}/resolve:
    post:
      summary: >
        Juge la réclamation fondée — motif obligatoire et action librement
        choisie selon la gravité, aucune sanction automatique. "suspension"
        réutilise le mécanisme de suspension de compte déjà construit
        (CLAUDE.md §5, ajout v0.11).
      tags: [Admin]
      parameters:
        - name: dispute
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, action]
              properties:
                reason: {type: string, maxLength: 1000}
                action: {type: string, enum: [warning, suspension]}
      responses:
        '200':
          description: Réclamation jugée fondée.
        '403':
          description: Cette réclamation est déjà tranchée.
        '422':
          description: Motif ou action manquant/invalide, ou inscription introuvable pour une suspension.

  /admin/disputes/{dispute}/close:
    post:
      summary: >
        Clôture le dossier une fois la décision (et son éventuelle suite)
        actée — pas de clôture automatique (CLAUDE.md §5, ajout v0.11).
      tags: [Admin]
      parameters:
        - name: dispute
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Réclamation clôturée.
        '403':
          description: Seule une réclamation déjà tranchée peut être clôturée.

  /admin/disputes/{dispute}/attachments/{attachment}/download:
    get:
      summary: Télécharge une photo jointe en preuve à une réclamation.
      tags: [Admin]
      parameters:
        - name: dispute
          in: path
          required: true
          schema: {type: integer}
        - name: attachment
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Fichier binaire de l'image.
        '404':
          description: Photo n'appartenant pas à cette réclamation.

  /admin/statistics:
    get:
      summary: >
        Statistiques agrégées pour appuyer les politiques de
        régulation/formalisation du secteur auprès des autorités béninoises
        (CLAUDE.md §1, ajout v0.17) : structures par type/statut, répartition
        géographique (ville/région), volume d'activité sur une période
        optionnelle, avis et réclamations.
      tags: [Admin]
      parameters:
        - name: start_date
          in: query
          required: false
          schema: {type: string, format: date}
          description: Borne basse du volume d'activité (incluse). Totaux depuis le début si absente.
        - name: end_date
          in: query
          required: false
          schema: {type: string, format: date}
          description: Borne haute du volume d'activité (incluse) ; doit être postérieure ou égale à start_date.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      structures:
                        type: object
                        description: >
                          Par type de compte (garagiste/market_space), compté
                          depuis professional_registrations : approved,
                          pending, suspended, rejected, total.
                      geography:
                        type: object
                        properties:
                          by_city:
                            type: array
                            items:
                              type: object
                              properties:
                                city: {type: string, nullable: true}
                                city_label: {type: string}
                                count: {type: integer}
                          by_region:
                            type: array
                            items:
                              type: object
                              properties:
                                region: {type: string, nullable: true}
                                region_label: {type: string}
                                count: {type: integer}
                      activity:
                        type: object
                        properties:
                          period:
                            type: object
                            properties:
                              start: {type: string, format: date, nullable: true}
                              end: {type: string, format: date, nullable: true}
                          appointments_count: {type: integer}
                          quotes_issued_count: {type: integer}
                          orders_count: {type: integer}
                          invoices_count: {type: integer, description: Devis facturés + commandes payées.}
                          total_invoiced_amount: {type: string, description: "Somme décimale (2 décimales) des devis facturés et commandes payées."}
                      reviews:
                        type: object
                        properties:
                          count: {type: integer}
                          average_rating: {type: number, nullable: true}
                      disputes:
                        type: object
                        properties:
                          total: {type: integer}
                          by_status: {type: object}
        '422':
          description: end_date antérieure à start_date.

  /garage/profile:
    get:
      summary: >
        Profil du garage du compte Garagiste authentifié. Créé automatiquement
        à l'approbation du dossier KYC (voir /admin/registrations/{id}/approve) ;
        404 tant que le compte n'est pas encore validé.
      tags: [Garage]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Garage'
        '404':
          description: Profil pas encore créé (compte non validé).
    put:
      summary: >
        Met à jour le profil du garage (nom, adresse, ville/région
        structurées, géoloc, téléphone).
      tags: [Garage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address]
              properties:
                name: {type: string}
                description: {type: string, nullable: true}
                address: {type: string}
                city:
                  type: string
                  nullable: true
                  description: "Valeur de App\\Enums\\City (CLAUDE.md §5, ajout v0.17)."
                region:
                  type: string
                  nullable: true
                  description: "Valeur de App\\Enums\\Region (CLAUDE.md §5, ajout v0.17)."
                latitude: {type: number, nullable: true}
                longitude: {type: number, nullable: true}
                phone: {type: string, nullable: true}
      responses:
        '200':
          description: Profil mis à jour.

  /garage/profile/opening-hours:
    put:
      summary: Remplace intégralement les horaires d'ouverture (7 jours requis).
      tags: [Garage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hours]
              properties:
                hours:
                  type: array
                  minItems: 7
                  maxItems: 7
                  items:
                    type: object
                    required: [day_of_week, is_closed]
                    properties:
                      day_of_week: {type: integer, minimum: 1, maximum: 7}
                      is_closed: {type: boolean}
                      opens_at: {type: string, nullable: true, example: "08:00"}
                      closes_at: {type: string, nullable: true, example: "18:00"}
      responses:
        '200':
          description: Horaires mis à jour.
        '422':
          description: Jour manquant, ou horaires incohérents (fermeture avant ouverture).

  /garage/profile/images:
    post:
      summary: Ajoute une ou plusieurs photos du garage.
      tags: [Garage]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  items: {type: string, format: binary}
      responses:
        '201':
          description: Photo(s) ajoutée(s).

  /garage/profile/images/{image}:
    delete:
      summary: Supprime une photo du garage (doit appartenir au garage authentifié).
      tags: [Garage]
      parameters:
        - name: image
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Photo supprimée.
        '404':
          description: Photo introuvable ou appartenant à un autre garage.

  /garage/products:
    get:
      summary: Catalogue de la mini-boutique du garage authentifié (tous statuts).
      tags: [Garage]
      responses:
        '200':
          description: Liste paginée.
    post:
      summary: Ajoute un produit à la mini-boutique — en attente de validation admin (CLAUDE.md §5, règle 5).
      tags: [Garage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price, stock_quantity]
              properties:
                name: {type: string}
                description: {type: string, nullable: true}
                sku: {type: string, nullable: true}
                price: {type: number}
                stock_quantity: {type: integer}
      responses:
        '201':
          description: Produit créé, statut "pending".

  /garage/products/{product}:
    put:
      summary: Met à jour un produit de la mini-boutique — repasse en "pending" (CLAUDE.md §5, règle 5).
      tags: [Garage]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price]
              properties:
                name: {type: string}
                description: {type: string, nullable: true}
                sku: {type: string, nullable: true}
                price: {type: number}
      responses:
        '200':
          description: Produit mis à jour.
        '404':
          description: Produit introuvable ou appartenant à un autre garage.
    delete:
      summary: Supprime un produit de la mini-boutique.
      tags: [Garage]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Produit supprimé.

  /garage/products/{product}/stock:
    put:
      summary: >
        Corrige la quantité en stock d'un produit — ne touche pas au statut de
        validation admin (correction de quantité, pas remise en cause du produit).
        Le seuil d'alerte de stock bas voyage aussi ici plutôt que dans la mise
        à jour de contenu, pour la même raison (CLAUDE.md §5, ajout v0.12).
      tags: [Garage]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stock_quantity]
              properties:
                stock_quantity: {type: integer}
                low_stock_threshold:
                  type: integer
                  nullable: true
                  description: >
                    Optionnel, pas de valeur par défaut imposée. Une notification
                    est envoyée au vendeur quand le stock descend à ce seuil ou
                    en dessous suite à une vente, une seule fois jusqu'à un
                    réapprovisionnement au-dessus du seuil (CLAUDE.md §5, ajout v0.12).
      responses:
        '200':
          description: Stock mis à jour.

  /garage/services:
    get:
      summary: Catalogue des services de réparation du garage authentifié (tous statuts).
      tags: [Garage]
      responses:
        '200':
          description: Liste paginée.
    post:
      summary: Ajoute un service de réparation — en attente de validation admin (CLAUDE.md §5, règle 5).
      tags: [Garage]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, description, category, price, duration_minutes]
              properties:
                name: {type: string}
                description: {type: string, maxLength: 500}
                category:
                  type: string
                  enum: [entretien_courant, freinage_suspension, pneumatiques, electricite_electronique, climatisation_refroidissement, carrosserie, diagnostic_controle, autre_divers]
                price: {type: number}
                duration_minutes: {type: integer}
                image: {type: string, format: binary}
      responses:
        '201':
          description: Service créé, statut "pending".

  /garage/services/{service}:
    put:
      summary: Met à jour un service (contenu) — repasse en "pending" (CLAUDE.md §5, règle 5).
      tags: [Garage]
      parameters:
        - name: service
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, description, category, price, duration_minutes]
              properties:
                name: {type: string}
                description: {type: string, maxLength: 500}
                category:
                  type: string
                  enum: [entretien_courant, freinage_suspension, pneumatiques, electricite_electronique, climatisation_refroidissement, carrosserie, diagnostic_controle, autre_divers]
                price: {type: number}
                duration_minutes: {type: integer}
                image: {type: string, format: binary}
      responses:
        '200':
          description: Service mis à jour.
        '404':
          description: Service introuvable ou appartenant à un autre garage.
    delete:
      summary: Supprime un service.
      tags: [Garage]
      parameters:
        - name: service
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Service supprimé.

  /garage/services/{service}/availability:
    put:
      summary: >
        Active/désactive la disponibilité du service — ne touche pas au statut
        de validation admin (CLAUDE.md §5, ajout v0.6).
      tags: [Garage]
      parameters:
        - name: service
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active: {type: boolean}
      responses:
        '200':
          description: Disponibilité mise à jour.

  /garage/appointments:
    get:
      summary: Liste les RDV reçus par le garage authentifié (tous statuts).
      tags: [Garage]
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [pending, confirmed, rejected, rescheduled, cancelled, completed]}
      responses:
        '200':
          description: Liste paginée.

  /garage/appointments/{appointment}:
    get:
      summary: Détail d'un RDV reçu par le garage authentifié.
      tags: [Garage]
      parameters:
        - name: appointment
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK
        '404':
          description: RDV introuvable ou appartenant à un autre garage.

  /garage/appointments/{appointment}/confirm:
    post:
      summary: Confirme un RDV en attente à la date demandée (CLAUDE.md §5, ajout v0.7).
      tags: [Garage]
      parameters:
        - name: appointment
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: RDV confirmé.
        '403':
          description: RDV n'est plus en attente.
        '404':
          description: RDV introuvable ou appartenant à un autre garage.

  /garage/appointments/{appointment}/reject:
    post:
      summary: Refuse un RDV en attente — motif optionnel (CLAUDE.md §5, ajout v0.7).
      tags: [Garage]
      parameters:
        - name: appointment
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, nullable: true}
      responses:
        '200':
          description: RDV refusé.
        '403':
          description: RDV n'est plus en attente.

  /garage/appointments/{appointment}/reschedule:
    post:
      summary: >
        Propose une autre date pour un RDV en attente (statut "rescheduled",
        en attente de la réponse du client) — CLAUDE.md §5, ajout v0.7.
      tags: [Garage]
      parameters:
        - name: appointment
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proposed_at]
              properties:
                proposed_at: {type: string, format: date-time}
      responses:
        '200':
          description: Nouvelle date proposée.
        '403':
          description: RDV n'est plus en attente.
        '422':
          description: Date manquante ou dans le passé.

  /garage/quotes:
    get:
      summary: Liste tous les devis du garage, avec ou sans RDV associé (CLAUDE.md §5, ajout v0.9).
      tags: [Garage]
      responses:
        '200':
          description: OK
    post:
      summary: >
        Crée un devis en brouillon directement pour un client, sans RDV
        (CLAUDE.md §5, ajout v0.9) : un devis est nécessaire dès qu'il y a une
        prestation, que le client se soit présenté avec ou sans RDV
        préalable. `client_id` peut être un automobiliste existant ou un
        compte "express" créé au préalable via /garage/clients/express.
      tags: [Garage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, lines]
              properties:
                client_id: {type: integer, description: "Doit être un compte automobiliste existant."}
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [type, quantity]
                    properties:
                      type: {type: string, enum: [diagnosis_fee, service, product]}
                      repair_service_id: {type: integer, description: "Requis si type=service."}
                      product_id: {type: integer, description: "Requis si type=product."}
                      label: {type: string, description: "Requis si type=diagnosis_fee (sinon repris du catalogue)."}
                      unit_price: {type: number, description: "Requis si type=diagnosis_fee (sinon repris du catalogue, jamais accepté du client pour service/product)."}
                      quantity: {type: integer, minimum: 1}
      responses:
        '201':
          description: Devis créé en brouillon.
        '404':
          description: client_id introuvable ou n'est pas un compte automobiliste.
        '422':
          description: client_id manquant, ligne invalide, ou stock insuffisant pour une ligne produit.

  /garage/quotes/{quote}:
    get:
      summary: Consulte un devis du garage par son id, avec ou sans RDV associé (CLAUDE.md §5, ajout v0.9).
      tags: [Garage]
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK
        '404':
          description: Devis appartenant à un autre garage.

  /garage/clients/express:
    post:
      summary: >
        Crée (ou rattache à un compte automobiliste existant, par email ou
        téléphone) un compte client "express" pour un client walk-in sans app
        (CLAUDE.md §5, ajout v0.9) — préalable typique à un devis sans RDV.
      tags: [Garage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, phone]
              properties:
                name: {type: string}
                email: {type: string, format: email}
                phone: {type: string}
      responses:
        '201':
          description: Nouveau compte "express" créé.
        '200':
          description: Rattaché à un compte automobiliste existant (email ou téléphone correspondant).
        '422':
          description: L'email ou le téléphone correspond à un compte professionnel — refusé.

  /garage/appointments/{appointment}/quote:
    post:
      summary: >
        Crée un devis en brouillon depuis un RDV confirmé (diagnostic
        effectué sur place) — chemin conservé pour la traçabilité, le RDV
        n'étant plus une condition obligatoire pour créer un devis
        (CLAUDE.md §5, ajout v0.9). Un seul devis par RDV.
      tags: [Garage]
      parameters:
        - name: appointment
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [type, quantity]
                    properties:
                      type: {type: string, enum: [diagnosis_fee, service, product]}
                      repair_service_id: {type: integer, description: "Requis si type=service."}
                      product_id: {type: integer, description: "Requis si type=product."}
                      label: {type: string, description: "Requis si type=diagnosis_fee (sinon repris du catalogue)."}
                      unit_price: {type: number, description: "Requis si type=diagnosis_fee (sinon repris du catalogue, jamais accepté du client pour service/product)."}
                      quantity: {type: integer, minimum: 1}
      responses:
        '201':
          description: Devis créé en brouillon.
        '403':
          description: RDV pas confirmé, ou devis déjà existant pour ce RDV.
        '422':
          description: Ligne invalide, ou stock insuffisant pour une ligne produit.
    get:
      summary: Consulte le devis d'un RDV (garagiste propriétaire).
      tags: [Garage]
      parameters:
        - name: appointment
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK
        '404':
          description: Pas de devis pour ce RDV, ou RDV appartenant à un autre garage.

  /garage/quotes/{quote}/versions/{version}:
    put:
      summary: Modifie les lignes d'une version encore en brouillon (pas envoyée) — CLAUDE.md §5, ajout v0.8.
      tags: [Garage]
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
        - name: version
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  items: {type: object}
      responses:
        '200':
          description: Brouillon mis à jour.
        '403':
          description: Cette version a déjà été envoyée.

  /garage/quotes/{quote}/versions/{version}/send:
    post:
      summary: >
        Génère le PDF, envoie la version au client et poste un message
        système avec le PDF en pièce jointe dans la conversation
        garage/client (CLAUDE.md §5, ajout v0.8).
      tags: [Garage]
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
        - name: version
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Devis envoyé.
        '403':
          description: Cette version a déjà été envoyée.

  /garage/quotes/{quote}/versions/{version}/pdf:
    get:
      summary: Télécharge le PDF d'une version déjà envoyée.
      tags: [Garage]
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
        - name: version
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Fichier binaire du PDF.
        '404':
          description: PDF pas encore généré, ou devis appartenant à un autre garage.

  /garage/quotes/{quote}/versions:
    post:
      summary: >
        Renégociation après un refus : nouvelle version brouillon, à envoyer
        séparément via /send (CLAUDE.md §5, ajout v0.8).
      tags: [Garage]
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  items: {type: object}
      responses:
        '201':
          description: Nouvelle version créée en brouillon.
        '403':
          description: Le devis précédent n'a pas été refusé.

  /garage/quotes/{quote}/start:
    post:
      summary: Démarre la prestation après acceptation du devis par le client.
      tags: [Garage]
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Prestation démarrée.
        '403':
          description: Le devis n'a pas été validé par le client.

  /garage/quotes/{quote}/mark-paid:
    post:
      summary: >
        Paiement manuel V1 (espèces ou autre — pas encore d'agrégateur en
        ligne, CLAUDE.md §7) : génère la facture (nouveau PDF, même contenu,
        mention "Facture") et clôture le RDV avec prestation réalisée.
      tags: [Garage]
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Paiement enregistré, facture générée.
        '403':
          description: La prestation n'est pas en cours.

  /garage/quotes/{quote}/abandon:
    post:
      summary: >
        Négociation infructueuse : clôture le RDV sans prestation ni facture
        (CLAUDE.md §5, ajout v0.8) — distinct d'une clôture avec prestation
        réalisée (cf. Appointment.wasCompletedWithService côté modèle).
      tags: [Garage]
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: RDV clôturé sans suite.
        '403':
          description: Le devis n'a pas été refusé.

  /garage/orders:
    get:
      summary: Liste les commandes isolées de la mini-boutique, sans prestation associée (CLAUDE.md §5, ajout v0.9).
      tags: [Garage]
      responses:
        '200':
          description: OK

  /garage/orders/{order}:
    get:
      summary: Consulte une commande de la mini-boutique.
      tags: [Garage]
      parameters:
        - name: order
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK
        '404':
          description: Commande appartenant à un autre vendeur.

  /garage/orders/{order}/mark-paid:
    post:
      summary: >
        Paiement manuel V1 (espèces ou autre — CLAUDE.md §7) : décrémente le
        stock (même mécanisme unique que le module Devis — CLAUDE.md §5,
        ajout v0.4), génère la facture et notifie via le chat.
      tags: [Garage]
      parameters:
        - name: order
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Paiement enregistré, facture générée.
        '403':
          description: Cette commande n'est plus en attente de paiement.

  /garage/orders/{order}/pdf:
    get:
      summary: Télécharge la facture PDF d'une commande payée.
      tags: [Garage]
      parameters:
        - name: order
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Fichier binaire du PDF.
        '404':
          description: Facture pas encore générée, ou commande appartenant à un autre vendeur.

  /garage/conversations:
    get:
      summary: >
        Liste les conversations déjà initiées par des automobilistes avec ce
        garage — pas de création côté garage (CLAUDE.md §5, ajout v0.8).
      tags: [Garage]
      responses:
        '200':
          description: Liste paginée, triée par dernier message.

  /garage/conversations/{conversation}/messages:
    get:
      summary: Liste les messages d'une conversation du garage authentifié.
      tags: [Garage]
      parameters:
        - name: conversation
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Liste paginée.
        '404':
          description: Conversation appartenant à un autre garage.
    post:
      summary: Répond dans une conversation — texte et/ou image.
      tags: [Garage]
      parameters:
        - name: conversation
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                body: {type: string, nullable: true, maxLength: 2000}
                image: {type: string, format: binary, nullable: true}
      responses:
        '201':
          description: Message envoyé.
        '422':
          description: Ni texte ni image fournis.

  /garage/conversations/{conversation}/messages/{message}/image:
    get:
      summary: Télécharge la pièce jointe image d'un message.
      tags: [Garage]
      parameters:
        - name: conversation
          in: path
          required: true
          schema: {type: integer}
        - name: message
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Fichier binaire de l'image.
        '404':
          description: Message sans image, ou conversation appartenant à un autre garage.

  /garage/reviews:
    get:
      summary: >
        Avis reçus par le garage authentifié, en lecture seule — y compris
        les avis masqués par modération, pour transparence sur son propre
        historique (CLAUDE.md §5, ajout v0.10).
      tags: [Garage]
      responses:
        '200':
          description: Liste paginée.

  /garage/disputes:
    get:
      summary: Liste les réclamations concernant le garage authentifié (CLAUDE.md §5, ajout v0.11).
      tags: [Garage]
      responses:
        '200':
          description: Liste paginée.

  /garage/disputes/{dispute}:
    get:
      summary: Détail d'une réclamation concernant le garage, avec ses preuves et l'espace d'échange dédié.
      tags: [Garage]
      parameters:
        - name: dispute
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK
        '404':
          description: Réclamation concernant un autre garage.

  /garage/disputes/{dispute}/respond:
    post:
      summary: >
        Répond/se défend dans l'espace d'échange dédié à la réclamation —
        jamais de décision côté garage, réservée à l'admin (CLAUDE.md §5,
        ajout v0.11).
      tags: [Garage]
      parameters:
        - name: dispute
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, maxLength: 2000}
      responses:
        '201':
          description: Réponse envoyée.
        '403':
          description: Cette réclamation est déjà tranchée.
        '404':
          description: Réclamation concernant un autre garage.

  /garage/disputes/{dispute}/attachments/{attachment}/download:
    get:
      summary: Télécharge une photo jointe en preuve à une réclamation.
      tags: [Garage]
      parameters:
        - name: dispute
          in: path
          required: true
          schema: {type: integer}
        - name: attachment
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Fichier binaire de l'image.
        '404':
          description: Photo n'appartenant pas à cette réclamation, ou réclamation concernant un autre garage.

  /garage/notifications:
    get:
      summary: Liste les notifications push du compte garagiste authentifié (CLAUDE.md §5, ajout v0.12).
      tags: [Garage]
      responses:
        '200':
          description: Liste paginée.

  /garage/notifications/{notification}/read:
    post:
      summary: Marque une de ses notifications comme lue (idempotent).
      tags: [Garage]
      parameters:
        - name: notification
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Notification marquée comme lue.
        '404':
          description: Notification appartenant à un autre compte.

  /garage/device-tokens:
    put:
      summary: >
        Enregistre ou met à jour le jeton FCM de l'appareil courant, à
        appeler à chaque connexion (CLAUDE.md §5, ajout v0.12). Un même
        jeton n'appartient jamais qu'à un seul compte à la fois.
      tags: [Garage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
                platform: {type: string, enum: [android, ios, web], nullable: true}
      responses:
        '200':
          description: Jeton enregistré.

  /market-space/products:
    get:
      summary: Catalogue du compte Market Space authentifié (tous statuts).
      tags: [MarketSpace]
      responses:
        '200':
          description: Liste paginée.
    post:
      summary: Ajoute un produit — en attente de validation admin (CLAUDE.md §5, règle 5).
      tags: [MarketSpace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price, stock_quantity]
              properties:
                name: {type: string}
                description: {type: string, nullable: true}
                sku: {type: string, nullable: true}
                price: {type: number}
                stock_quantity: {type: integer}
      responses:
        '201':
          description: Produit créé, statut "pending".

  /market-space/products/{product}:
    put:
      summary: Met à jour un produit — repasse en "pending" (CLAUDE.md §5, règle 5).
      tags: [MarketSpace]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price]
              properties:
                name: {type: string}
                description: {type: string, nullable: true}
                sku: {type: string, nullable: true}
                price: {type: number}
      responses:
        '200':
          description: Produit mis à jour.
        '404':
          description: Produit introuvable ou appartenant à un autre compte Market Space.
    delete:
      summary: Supprime un produit.
      tags: [MarketSpace]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Produit supprimé.

  /market-space/products/{product}/stock:
    put:
      summary: >
        Corrige la quantité en stock — ne touche pas au statut de validation
        admin. Le seuil d'alerte de stock bas voyage aussi ici (CLAUDE.md §5,
        ajout v0.12).
      tags: [MarketSpace]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stock_quantity]
              properties:
                stock_quantity: {type: integer}
                low_stock_threshold: {type: integer, nullable: true}
      responses:
        '200':
          description: Stock mis à jour.

  /market-space/orders:
    get:
      summary: Liste les commandes du Market Space, stock distinct de celui d'un garage (CLAUDE.md §5, ajout v0.9).
      tags: [MarketSpace]
      responses:
        '200':
          description: OK

  /market-space/orders/{order}:
    get:
      summary: Consulte une commande du Market Space.
      tags: [MarketSpace]
      parameters:
        - name: order
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK
        '404':
          description: Commande appartenant à un autre vendeur.

  /market-space/orders/{order}/mark-paid:
    post:
      summary: >
        Paiement manuel V1 (CLAUDE.md §7) : décrémente le stock et génère la
        facture. Pas de notification chat pour cette paire (non construite —
        CLAUDE.md §5, ajout v0.8).
      tags: [MarketSpace]
      parameters:
        - name: order
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Paiement enregistré, facture générée.
        '403':
          description: Cette commande n'est plus en attente de paiement.

  /market-space/orders/{order}/pdf:
    get:
      summary: Télécharge la facture PDF d'une commande payée.
      tags: [MarketSpace]
      parameters:
        - name: order
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Fichier binaire du PDF.
        '404':
          description: Facture pas encore générée, ou commande appartenant à un autre vendeur.

  /market-space/reviews:
    get:
      summary: >
        Avis reçus par le Market Space authentifié, en lecture seule — y
        compris les avis masqués par modération, pour transparence sur son
        propre historique (CLAUDE.md §5, ajout v0.10).
      tags: [MarketSpace]
      responses:
        '200':
          description: Liste paginée.

  /market-space/disputes:
    get:
      summary: Liste les réclamations concernant le Market Space authentifié (CLAUDE.md §5, ajout v0.11).
      tags: [MarketSpace]
      responses:
        '200':
          description: Liste paginée.

  /market-space/disputes/{dispute}:
    get:
      summary: Détail d'une réclamation concernant le Market Space, avec ses preuves et l'espace d'échange dédié.
      tags: [MarketSpace]
      parameters:
        - name: dispute
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK
        '404':
          description: Réclamation concernant un autre Market Space.

  /market-space/disputes/{dispute}/respond:
    post:
      summary: >
        Répond/se défend dans l'espace d'échange dédié à la réclamation —
        jamais de décision côté Market Space, réservée à l'admin
        (CLAUDE.md §5, ajout v0.11).
      tags: [MarketSpace]
      parameters:
        - name: dispute
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, maxLength: 2000}
      responses:
        '201':
          description: Réponse envoyée.
        '403':
          description: Cette réclamation est déjà tranchée.
        '404':
          description: Réclamation concernant un autre Market Space.

  /market-space/disputes/{dispute}/attachments/{attachment}/download:
    get:
      summary: Télécharge une photo jointe en preuve à une réclamation.
      tags: [MarketSpace]
      parameters:
        - name: dispute
          in: path
          required: true
          schema: {type: integer}
        - name: attachment
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Fichier binaire de l'image.
        '404':
          description: Photo n'appartenant pas à cette réclamation, ou réclamation concernant un autre Market Space.

  /market-space/notifications:
    get:
      summary: Liste les notifications push du compte Market Space authentifié (CLAUDE.md §5, ajout v0.12).
      tags: [MarketSpace]
      responses:
        '200':
          description: Liste paginée.

  /market-space/notifications/{notification}/read:
    post:
      summary: Marque une de ses notifications comme lue (idempotent).
      tags: [MarketSpace]
      parameters:
        - name: notification
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Notification marquée comme lue.
        '404':
          description: Notification appartenant à un autre compte.

  /market-space/device-tokens:
    put:
      summary: >
        Enregistre ou met à jour le jeton FCM de l'appareil courant
        (CLAUDE.md §5, ajout v0.12).
      tags: [MarketSpace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
                platform: {type: string, enum: [android, ios, web], nullable: true}
      responses:
        '200':
          description: Jeton enregistré.

  /mobile/garages:
    get:
      summary: >
        Liste les garages visibles publiquement (compte validé uniquement),
        avec note moyenne ("average_rating") et nombre d'avis visibles
        ("reviews_count") — CLAUDE.md §5, ajout v0.10. Pas de tri par
        proximité ici : voir /mobile/search/nearby pour la recherche
        géolocalisée (CLAUDE.md §5, ajout v0.13).
      tags: [Mobile]
      security: []
      responses:
        '200':
          description: Liste paginée.

  /mobile/garages/{garage}:
    get:
      summary: >
        Détail public d'un garage, avec sa mini-boutique ("products", produits
        "approved" uniquement), ses services ("services", "approved" ET actifs
        uniquement) et sa note moyenne ("average_rating"/"reviews_count") —
        CLAUDE.md §5, ajouts v0.4, v0.6 et v0.10.
      tags: [Mobile]
      security: []
      parameters:
        - name: garage
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK
        '404':
          description: Garage inexistant, compte non validé, ou suspendu (CLAUDE.md §5, ajout v0.6).

  /mobile/garages/{garage}/reviews:
    get:
      summary: Avis publics d'un garage (les avis masqués par modération n'y apparaissent jamais).
      tags: [Mobile]
      security: []
      parameters:
        - name: garage
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Liste paginée.
        '404':
          description: Garage inexistant ou non visible publiquement.

  /mobile/market-space-accounts:
    get:
      summary: >
        Liste les boutiques Market Space visibles publiquement (compte
        validé, non suspendu), avec note moyenne ("average_rating") et
        nombre d'avis visibles ("reviews_count") — CLAUDE.md §5, ajout v0.10.
      tags: [Mobile]
      security: []
      responses:
        '200':
          description: Liste paginée.

  /mobile/market-space-accounts/{marketSpaceAccount}:
    get:
      summary: >
        Détail public d'une boutique Market Space, avec son catalogue
        approuvé et sa note moyenne ("average_rating"/"reviews_count") —
        CLAUDE.md §5, ajout v0.10.
      tags: [Mobile]
      security: []
      parameters:
        - name: marketSpaceAccount
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK
        '404':
          description: Boutique inexistante, compte non validé, ou suspendu (CLAUDE.md §5, ajout v0.6).

  /mobile/market-space-accounts/{marketSpaceAccount}/reviews:
    get:
      summary: Avis publics d'un Market Space (les avis masqués par modération n'y apparaissent jamais).
      tags: [Mobile]
      security: []
      parameters:
        - name: marketSpaceAccount
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Liste paginée.
        '404':
          description: Boutique inexistante ou non visible publiquement.

  /mobile/search/nearby:
    get:
      summary: >
        Recherche de garages et Market Space approuvés (et non suspendus) —
        CLAUDE.md §5, ajouts v0.13 (proximité), v0.14 (nom, service, tri),
        v0.15 (nom de produit) et v0.16 (tranche de prix). Tous les critères
        (position, nom, service, tri, nom de produit, tranche de prix) sont
        optionnels et combinables ; un client peut chercher par nom seul,
        sans position. Seuls le rayon et le tri par distance exigent une
        position transmise par l'automobiliste, puisqu'ils n'ont pas de sens
        sans elle. La proximité est indépendante de tout fournisseur de
        cartographie externe — uniquement un calcul de distance (formule de
        Haversine), l'affichage sur une carte est un sujet frontend séparé.
        Publique, comme les autres listes de découverte : utile même sans
        session (panne, avant inscription). Pas d'écran "urgence" dédié côté
        backend : le futur raccourci "urgence" du frontend appellera cette
        même route avec sort=distance et open_now (une fois ce filtre
        construit côté frontend) plutôt qu'un nouvel endpoint.
      tags: [Mobile]
      security: []
      parameters:
        - name: latitude
          in: query
          required: false
          description: >
            Obligatoire si longitude, radius_km ou sort=distance est fourni ;
            optionnelle sinon (recherche par nom/service sans position).
          schema: {type: number, format: float, minimum: -90, maximum: 90}
        - name: longitude
          in: query
          required: false
          description: Obligatoire si latitude, radius_km ou sort=distance est fourni.
          schema: {type: number, format: float, minimum: -180, maximum: 180}
        - name: radius_km
          in: query
          required: false
          description: >
            Rayon maximum en kilomètres (nécessite latitude/longitude). Par
            défaut GEO_DEFAULT_SEARCH_RADIUS_KM (15 km), plafonné à
            GEO_MAX_SEARCH_RADIUS_KM (100 km) même si une valeur plus grande
            est demandée.
          schema: {type: number, format: float, minimum: 0.1}
        - name: type
          in: query
          required: false
          schema: {type: string, enum: [garage, market_space, both], default: both}
        - name: name
          in: query
          required: false
          description: Recherche partielle, insensible à la casse et aux accents, sur le nom du vendeur (garage ou Market Space).
          schema: {type: string, maxLength: 255}
        - name: service_category
          in: query
          required: false
          description: >
            Restreint aux garages proposant un service approuvé et actif de
            cette catégorie. Un Market Space ne fait jamais de réparation :
            ce filtre exclut donc toujours les Market Space, quel que soit
            "type" (CLAUDE.md §5, ajout v0.6).
          schema: {type: string, enum: [entretien_courant, freinage_suspension, pneumatiques, electricite_electronique, climatisation_refroidissement, carrosserie, diagnostic_controle, autre_divers]}
        - name: service_id
          in: query
          required: false
          description: Restreint au garage proposant précisément ce service (approuvé et actif). Même exclusion des Market Space que service_category.
          schema: {type: integer}
        - name: sort
          in: query
          required: false
          description: >
            "distance" (nécessite une position) ou "rating" (note moyenne
            décroissante, non notés en dernier, égalité départagée par nom).
            Par défaut "distance" si une position est fournie, sinon
            "rating".
          schema: {type: string, enum: [distance, rating]}
        - name: product_name
          in: query
          required: false
          description: >
            Recherche partielle, insensible à la casse et aux accents (même
            comparaison que "name"), sur le nom des produits du catalogue
            (mini-boutique Garage ou Market Space — CLAUDE.md §5, ajout
            v0.15). Restreint aux vendeurs ayant au moins un produit
            approuvé correspondant ; contrairement à service_category/
            service_id, ce filtre concerne les deux types de vendeurs et
            n'exclut jamais les Market Space.
          schema: {type: string, maxLength: 255}
        - name: min_price
          in: query
          required: false
          description: >
            Restreint aux vendeurs ayant au moins un produit approuvé dont
            le prix est supérieur ou égal à cette valeur (CLAUDE.md §5,
            ajout v0.16). Combinable avec max_price (tranche fermée) ou
            seul (tranche ouverte vers le haut), et avec product_name (les
            deux conditions s'appliquent alors au même produit).
          schema: {type: number, format: float, minimum: 0}
        - name: max_price
          in: query
          required: false
          description: >
            Symétrique de min_price, vers le haut. Doit être supérieur ou
            égal à min_price si les deux sont fournis.
          schema: {type: number, format: float, minimum: 0}
        - name: page
          in: query
          required: false
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: >
            Liste paginée triée selon "sort". Chaque résultat porte : type
            ("garage"/"market_space"), id, name, address (adresse telle
            qu'enregistrée au profil, pas de format structuré court distinct),
            photo_url (première image du profil, nullable), distance_km
            (nullable — null si aucune position n'a été transmise),
            average_rating/reviews_count (avis visibles uniquement —
            CLAUDE.md §5, ajout v0.10), is_open_now (booléen, ou null si le
            professionnel n'a pas encore renseigné ses horaires pour le jour
            courant), et matched_products (tableau d'objets id/name/price —
            produits approuvés de ce vendeur correspondant à product_name
            et/ou à la tranche min_price/max_price ; toujours vide hors de
            ces filtres — CLAUDE.md §5, ajouts v0.15 et v0.16).
        '422':
          description: >
            Position incomplète alors qu'elle est requise (longitude/radius_km/
            sort=distance fourni sans latitude, ou l'inverse), position hors
            bornes, rayon invalide, type/service_category/sort inconnu,
            service_id inexistant, name/product_name trop long, min_price/
            max_price négatif, ou max_price inférieur à min_price.

  /mobile/appointments:
    get:
      summary: Liste les RDV de l'automobiliste authentifié (tous statuts).
      tags: [Mobile]
      responses:
        '200':
          description: Liste paginée.
    post:
      summary: >
        Demande un RDV auprès d'un garage — service du catalogue et/ou
        description libre, au moins l'un des deux requis. Ne déclenche aucun
        paiement (CLAUDE.md §5 règle 10, ajout v0.7).
      tags: [Mobile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [garage_id, requested_at]
              properties:
                garage_id: {type: integer}
                repair_service_id: {type: integer, nullable: true}
                description: {type: string, nullable: true, maxLength: 1000}
                requested_at: {type: string, format: date-time, description: "Doit être dans le futur."}
      responses:
        '201':
          description: RDV créé, statut "pending".
        '404':
          description: Garage introuvable/non validé, ou service introuvable pour ce garage.
        '422':
          description: Ni service ni description fournis, ou date dans le passé.

  /mobile/appointments/{appointment}:
    get:
      summary: Détail d'un RDV de l'automobiliste authentifié.
      tags: [Mobile]
      parameters:
        - name: appointment
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK
        '404':
          description: RDV introuvable ou appartenant à un autre automobiliste.

  /mobile/appointments/{appointment}/cancel:
    post:
      summary: >
        Annule un RDV (pending, confirmed, ou rescheduled) — sert aussi à
        refermer une contre-proposition du garagiste qui ne convient pas
        (CLAUDE.md §5, ajout v0.7).
      tags: [Mobile]
      parameters:
        - name: appointment
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: RDV annulé.
        '403':
          description: RDV déjà terminé/refusé/annulé, ne peut plus être annulé.

  /mobile/appointments/{appointment}/accept-reschedule:
    post:
      summary: Accepte la nouvelle date proposée par le garagiste (statut "rescheduled" uniquement).
      tags: [Mobile]
      parameters:
        - name: appointment
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: RDV confirmé à la nouvelle date.
        '403':
          description: Aucune contre-proposition en attente sur ce RDV.

  /mobile/quotes:
    get:
      summary: Liste tous ses devis, avec ou sans RDV associé (CLAUDE.md §5, ajout v0.9).
      tags: [Mobile]
      responses:
        '200':
          description: OK

  /mobile/quotes/{quote}:
    get:
      summary: Consulte un de ses devis par son id, avec ou sans RDV associé (CLAUDE.md §5, ajout v0.9).
      tags: [Mobile]
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK
        '404':
          description: Devis appartenant à un autre automobiliste.

  /mobile/appointments/{appointment}/quote:
    get:
      summary: Consulte le devis de son propre RDV.
      tags: [Mobile]
      parameters:
        - name: appointment
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK
        '404':
          description: Pas de devis pour ce RDV, ou RDV appartenant à un autre automobiliste.

  /mobile/quotes/{quote}/versions/{version}/accept:
    post:
      summary: >
        Accepte la version courante d'un devis — action digitale explicite,
        jamais déduite du chat (CLAUDE.md §5, ajout v0.8). Décrémente le
        stock des lignes de pièces.
      tags: [Mobile]
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
        - name: version
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Devis accepté.
        '403':
          description: Version pas envoyée, plus la version courante, ou devis plus en attente de décision.

  /mobile/quotes/{quote}/versions/{version}/reject:
    post:
      summary: Refuse la version courante d'un devis.
      tags: [Mobile]
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
        - name: version
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Devis refusé.
        '403':
          description: Version pas envoyée, plus la version courante, ou devis plus en attente de décision.

  /mobile/quotes/{quote}/versions/{version}/pdf:
    get:
      summary: Télécharge le PDF d'une version de son propre devis.
      tags: [Mobile]
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
        - name: version
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Fichier binaire du PDF.
        '404':
          description: PDF pas encore généré, ou devis appartenant à un autre automobiliste.

  /mobile/orders:
    get:
      summary: Liste ses propres commandes.
      tags: [Mobile]
      responses:
        '200':
          description: OK
    post:
      summary: >
        Achat isolé de pièces/produits, sans prestation associée (CLAUDE.md
        §5, règle 11 et ajout v0.9) : commande → paiement immédiat →
        facture. Toutes les lignes doivent provenir du même vendeur (Garage
        ou Market Space), déduit automatiquement des produits.
      tags: [Mobile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: {type: integer}
                      quantity: {type: integer, minimum: 1}
      responses:
        '201':
          description: Commande créée, en attente de paiement.
        '404':
          description: Produit introuvable, non approuvé, ou boutique non visible publiquement.
        '422':
          description: Lignes provenant de vendeurs différents, ou stock insuffisant.

  /mobile/orders/{order}:
    get:
      summary: Consulte une de ses commandes.
      tags: [Mobile]
      parameters:
        - name: order
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK
        '404':
          description: Commande appartenant à un autre automobiliste.

  /mobile/orders/{order}/cancel:
    post:
      summary: Annule une commande tant qu'elle n'est pas payée.
      tags: [Mobile]
      parameters:
        - name: order
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Commande annulée.
        '403':
          description: Cette commande ne peut plus être annulée.

  /mobile/orders/{order}/pdf:
    get:
      summary: Télécharge la facture PDF d'une commande payée.
      tags: [Mobile]
      parameters:
        - name: order
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Fichier binaire du PDF.
        '404':
          description: Facture pas encore générée, ou commande appartenant à un autre automobiliste.

  /mobile/conversations:
    get:
      summary: Liste les conversations de l'automobiliste authentifié.
      tags: [Mobile]
      responses:
        '200':
          description: Liste paginée, triée par dernier message.
    post:
      summary: >
        Démarre (ou récupère) la conversation avec un garage — possible à
        tout moment, y compris sans RDV existant (panne d'urgence).
        Idempotent : un seul canal par paire garage/automobiliste
        (CLAUDE.md §5, ajout v0.8).
      tags: [Mobile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [garage_id]
              properties:
                garage_id: {type: integer}
      responses:
        '201':
          description: Conversation prête (créée ou déjà existante).
        '404':
          description: Garage introuvable/non validé.

  /mobile/conversations/{conversation}/messages:
    get:
      summary: Liste les messages d'une conversation de l'automobiliste authentifié.
      tags: [Mobile]
      parameters:
        - name: conversation
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Liste paginée.
        '404':
          description: Conversation appartenant à un autre automobiliste.
    post:
      summary: Envoie un message — texte et/ou image.
      tags: [Mobile]
      parameters:
        - name: conversation
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                body: {type: string, nullable: true, maxLength: 2000}
                image: {type: string, format: binary, nullable: true}
      responses:
        '201':
          description: Message envoyé.
        '422':
          description: Ni texte ni image fournis.

  /mobile/conversations/{conversation}/messages/{message}/image:
    get:
      summary: Télécharge la pièce jointe image d'un message.
      tags: [Mobile]
      parameters:
        - name: conversation
          in: path
          required: true
          schema: {type: integer}
        - name: message
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Fichier binaire de l'image.
        '404':
          description: Message sans image, ou conversation appartenant à un autre automobiliste.

  /mobile/reviews:
    get:
      summary: Liste les avis laissés par l'automobiliste authentifié, tous garages/boutiques confondus.
      tags: [Mobile]
      responses:
        '200':
          description: Liste paginée.

  /mobile/quotes/{quote}/review:
    post:
      summary: >
        Laisse un avis sur un devis facturé — un seul avis par devis
        (CLAUDE.md §5, règle 7 et ajout v0.10).
      tags: [Mobile]
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: {type: integer, minimum: 1, maximum: 5}
                comment: {type: string, maxLength: 2000, nullable: true}
      responses:
        '201':
          description: Avis publié.
        '403':
          description: Devis pas encore facturé.
        '404':
          description: Devis appartenant à un autre automobiliste.
        '422':
          description: Ce devis a déjà été noté.

  /mobile/orders/{order}/review:
    post:
      summary: >
        Laisse un avis sur une commande payée — un seul avis par commande
        (CLAUDE.md §5, règle 7 et ajout v0.10).
      tags: [Mobile]
      parameters:
        - name: order
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: {type: integer, minimum: 1, maximum: 5}
                comment: {type: string, maxLength: 2000, nullable: true}
      responses:
        '201':
          description: Avis publié.
        '403':
          description: Commande pas encore payée.
        '404':
          description: Commande appartenant à un autre automobiliste.
        '422':
          description: Cette commande a déjà été notée.

  /mobile/disputes:
    get:
      summary: Liste les réclamations déposées par l'automobiliste authentifié, pour suivre leur statut.
      tags: [Mobile]
      responses:
        '200':
          description: Liste paginée.

  /mobile/disputes/{dispute}:
    get:
      summary: Consulte une de ses réclamations (statut, réponse du professionnel si demandée, décision finale si tranchée).
      tags: [Mobile]
      parameters:
        - name: dispute
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK
        '404':
          description: Réclamation appartenant à un autre automobiliste.

  /mobile/quotes/{quote}/dispute:
    post:
      summary: >
        Dépose une réclamation sur un devis facturé, avec motif obligatoire
        et photos en preuve optionnelles (CLAUDE.md §5, ajout v0.11).
      tags: [Mobile]
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 2000}
                photos:
                  type: array
                  maxItems: 5
                  items: {type: string, format: binary}
      responses:
        '201':
          description: Réclamation déposée.
        '403':
          description: Devis pas encore facturé.
        '404':
          description: Devis appartenant à un autre automobiliste.

  /mobile/orders/{order}/dispute:
    post:
      summary: >
        Dépose une réclamation sur une commande payée, avec motif obligatoire
        et photos en preuve optionnelles (CLAUDE.md §5, ajout v0.11).
      tags: [Mobile]
      parameters:
        - name: order
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 2000}
                photos:
                  type: array
                  maxItems: 5
                  items: {type: string, format: binary}
      responses:
        '201':
          description: Réclamation déposée.
        '403':
          description: Commande pas encore payée.
        '404':
          description: Commande appartenant à un autre automobiliste.

  /mobile/disputes/{dispute}/attachments/{attachment}/download:
    get:
      summary: Télécharge une photo jointe en preuve à sa propre réclamation.
      tags: [Mobile]
      parameters:
        - name: dispute
          in: path
          required: true
          schema: {type: integer}
        - name: attachment
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Fichier binaire de l'image.
        '404':
          description: Photo n'appartenant pas à cette réclamation, ou réclamation appartenant à un autre automobiliste.

  /mobile/notifications:
    get:
      summary: Liste les notifications push de l'automobiliste authentifié (CLAUDE.md §5, ajout v0.12).
      tags: [Mobile]
      responses:
        '200':
          description: Liste paginée.

  /mobile/notifications/{notification}/read:
    post:
      summary: Marque une de ses notifications comme lue (idempotent).
      tags: [Mobile]
      parameters:
        - name: notification
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Notification marquée comme lue.
        '404':
          description: Notification appartenant à un autre automobiliste.

  /mobile/device-tokens:
    put:
      summary: >
        Enregistre ou met à jour le jeton FCM de l'appareil courant — l'app
        Flutter l'appelle à chaque connexion (CLAUDE.md §5, ajout v0.12). Un
        même jeton n'appartient jamais qu'à un seul compte à la fois : une
        connexion avec un autre compte sur le même appareil le réassigne.
      tags: [Mobile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
                platform: {type: string, enum: [android, ios, web], nullable: true}
      responses:
        '200':
          description: Jeton enregistré.

# Les endpoints métier suivants (paiements en ligne...) sont ajoutés ici au
# fur et à mesure de leur implémentation, module par module.
