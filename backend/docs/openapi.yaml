openapi: 3.0.3
info:
  title: Make Cars API
  description: >
    API REST unique consommée par la SPA web (Admin / Garagiste / Market Space)
    et par l'application mobile Flutter (automobilistes). Voir /CLAUDE.md à la
    racine du projet pour le contexte métier et les règles de gestion.
  version: 0.2.0

servers:
  - url: http://localhost:8000/api
    description: Développement local

tags:
  - name: Auth
    description: Inscription, connexion, gestion des tokens (Laravel Sanctum).
  - name: Admin
    description: Endpoints réservés au dashboard Administrateur.
  - name: Garage
    description: Endpoints du dashboard Garagiste (compte Garagiste requis).
  - name: MarketSpace
    description: Endpoints du dashboard Market Space (compte Market Space requis).
  - name: Mobile
    description: Endpoints consommés par l'application mobile (automobilistes).

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
      description: "Token d'API Laravel Sanctum, envoyé en en-tête Authorization: Bearer <token>."

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [automobiliste, garagiste, market_space, admin]
        role_label:
          type: string
        professional_registration:
          $ref: '#/components/schemas/ProfessionalRegistration'

    ProfessionalRegistration:
      type: object
      nullable: true
      properties:
        id:
          type: integer
        structure_name:
          type: string
        address:
          type: string
        business_registration_number:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        rejection_reason:
          type: string
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        documents:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              type:
                type: string
                enum: [business_registration, premises_photo]
              download_url:
                type: string
        created_at:
          type: string
          format: date-time
        is_suspended:
          type: boolean
          description: >
            Compte déjà approuvé mais suspendu par un admin (fraude, plaintes,
            pièces de mauvaise qualité) — invisible côté mobile tant que suspendu,
            réversible (CLAUDE.md §5, ajout v0.6). N'affecte pas "status" ci-dessus.
        suspension_reason:
          type: string
          nullable: true
        suspended_at:
          type: string
          format: date-time
          nullable: true

    AuthPayload:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            token:
              type: string
        message:
          type: string

    Garage:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: string, nullable: true}
        address: {type: string}
        latitude: {type: number, format: float, nullable: true}
        longitude: {type: number, format: float, nullable: true}
        phone: {type: string, nullable: true}
        is_publicly_visible:
          type: boolean
          description: Reflète la validation admin du compte Garagiste (CLAUDE.md §5 règle 4), pas un champ propre au garage.
        opening_hours:
          type: array
          items:
            type: object
            properties:
              day_of_week: {type: integer, minimum: 1, maximum: 7, description: "ISO-8601 : 1 = lundi ... 7 = dimanche"}
              day_label: {type: string}
              is_closed: {type: boolean}
              opens_at: {type: string, nullable: true, example: "08:00"}
              closes_at: {type: string, nullable: true, example: "18:00"}
        images:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              url: {type: string}
              position: {type: integer}
        products:
          type: array
          items: {$ref: '#/components/schemas/Product'}
          description: Mini-boutique du garage — uniquement les produits "approved" hors dashboard Garagiste (CLAUDE.md §5, ajout v0.4).
        services:
          type: array
          items: {$ref: '#/components/schemas/Service'}
          description: Uniquement les services "approved" et actifs hors dashboard Garagiste (CLAUDE.md §5, ajout v0.6).

    MarketSpaceAccount:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: string, nullable: true}
        address: {type: string}
        phone: {type: string, nullable: true}
        is_publicly_visible:
          type: boolean
          description: Reflète la validation admin ET l'absence de suspension du compte Market Space (CLAUDE.md §5 règle 4, ajout v0.6).
        products:
          type: array
          items: {$ref: '#/components/schemas/Product'}

    Product:
      type: object
      description: >
        Un seul vendeur par produit : mini-boutique Garage OU Market Space,
        jamais les deux (relation polymorphe côté backend — CLAUDE.md §5, ajout v0.4).
      properties:
        id: {type: integer}
        sellable_type: {type: string, enum: [garage, market_space]}
        sellable_id: {type: integer}
        name: {type: string}
        description: {type: string, nullable: true}
        sku: {type: string, nullable: true}
        price: {type: string, description: "Décimal sérialisé en chaîne, ex. \"15000.00\"."}
        stock_quantity: {type: integer}
        status: {type: string, enum: [pending, approved, rejected]}
        rejection_reason: {type: string, nullable: true}
        is_publicly_visible:
          type: boolean
          description: "status == approved ET compte vendeur validé/non suspendu."
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    Service:
      type: object
      description: >
        Service de réparation, toujours rattaché à un Garage (jamais au Market
        Space), prix fixe unique — CLAUDE.md §5, ajout v0.6.
      properties:
        id: {type: integer}
        garage_id: {type: integer}
        name: {type: string}
        description: {type: string}
        category:
          type: string
          enum: [entretien_courant, freinage_suspension, pneumatiques, electricite_electronique, climatisation_refroidissement, carrosserie, diagnostic_controle, autre_divers]
        category_label: {type: string}
        price: {type: string, description: "Décimal sérialisé en chaîne, ex. \"15000.00\"."}
        duration_minutes: {type: integer}
        image_url: {type: string, nullable: true}
        is_active:
          type: boolean
          description: Disponibilité gérée par le garagiste, distincte de "status" (validation admin) — CLAUDE.md §5, ajout v0.6.
        status: {type: string, enum: [pending, approved, rejected]}
        rejection_reason: {type: string, nullable: true}
        is_publicly_visible:
          type: boolean
          description: "status == approved ET is_active == true ET garage validé/non suspendu."
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Vérifie que l'API est disponible.
      tags: [Auth]
      security: []
      responses:
        '200':
          description: L'API répond correctement.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  app:
                    type: string

  /auth/register/automobiliste:
    post:
      summary: Inscription d'un automobiliste (aucune validation admin requise).
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: {type: string}
                email: {type: string}
                phone: {type: string, nullable: true}
                password: {type: string}
                password_confirmation: {type: string}
      responses:
        '201':
          description: Compte créé, token émis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
        '422':
          description: Erreur de validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register/professionnel:
    post:
      summary: >
        Inscription d'un compte Garagiste ou Market Space avec justificatifs.
        Le compte est créé immédiatement (token émis) mais reste en attente de
        validation admin — aucun service/produit ne sera publiable tant que le
        statut n'est pas "approved" (CLAUDE.md §5, règle 4).
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name, email, password, password_confirmation, account_type
                - structure_name, address, business_registration_number
                - business_registration_document, premises_photos
              properties:
                name: {type: string}
                email: {type: string}
                phone: {type: string, nullable: true}
                password: {type: string}
                password_confirmation: {type: string}
                account_type: {type: string, enum: [garagiste, market_space]}
                structure_name: {type: string}
                address: {type: string}
                business_registration_number: {type: string}
                business_registration_document: {type: string, format: binary}
                premises_photos:
                  type: array
                  items: {type: string, format: binary}
      responses:
        '201':
          description: Dossier créé, en attente de validation admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
        '422':
          description: Erreur de validation.

  /auth/login:
    post:
      summary: Connexion (tout type de compte).
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string}
                password: {type: string}
      responses:
        '200':
          description: Connexion réussie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
        '422':
          description: Identifiants invalides.

  /auth/login/google:
    post:
      summary: >
        Connexion Google — réservée aux automobilistes (CLAUDE.md §5, ajout
        v0.5). Flux mobile natif : l'app Flutter fait le Google Sign-In
        elle-même et transmet l'ID token ici, pas de redirection navigateur.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token:
                  type: string
                  description: ID token (JWT) renvoyé par le SDK Google Sign-In côté app.
      responses:
        '200':
          description: Connexion réussie (compte automobiliste créé au besoin).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
        '422':
          description: >
            Jeton invalide/expiré/mal destiné, email non vérifié, ou email
            déjà utilisé par un compte professionnel (jamais rattaché à Google).

  /auth/me:
    get:
      summary: Profil de l'utilisateur authentifié.
      tags: [Auth]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'

  /auth/logout:
    post:
      summary: Révoque le token courant.
      tags: [Auth]
      responses:
        '200':
          description: Déconnexion réussie.

  /admin/registrations:
    get:
      summary: Liste les dossiers d'inscription professionnelle (admin uniquement).
      tags: [Admin]
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [pending, approved, rejected]}
      responses:
        '200':
          description: Liste paginée (enveloppe standard Laravel data/links/meta).
        '403':
          description: Réservé aux administrateurs.

  /admin/registrations/{registration}:
    get:
      summary: Détail d'un dossier d'inscription.
      tags: [Admin]
      parameters:
        - name: registration
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK
        '403':
          description: Non autorisé (ni admin, ni propriétaire du dossier).

  /admin/registrations/{registration}/documents/{document}:
    get:
      summary: Télécharge un justificatif KYC (registre de commerce ou photo du local).
      tags: [Admin]
      parameters:
        - name: registration
          in: path
          required: true
          schema: {type: integer}
        - name: document
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Fichier binaire du justificatif.
        '403':
          description: Non autorisé (ni admin, ni propriétaire du dossier).
        '404':
          description: Document introuvable ou n'appartenant pas à ce dossier.

  /admin/registrations/{registration}/approve:
    post:
      summary: Valide un dossier en attente (CLAUDE.md §5, règle 4).
      tags: [Admin]
      parameters:
        - name: registration
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Dossier validé.
        '403':
          description: Réservé aux administrateurs, ou dossier déjà traité.

  /admin/registrations/{registration}/reject:
    post:
      summary: Rejette un dossier en attente, avec motif obligatoire.
      tags: [Admin]
      parameters:
        - name: registration
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
      responses:
        '200':
          description: Dossier rejeté.
        '422':
          description: Motif manquant.

  /admin/registrations/{registration}/suspend:
    post:
      summary: >
        Suspend un compte déjà validé (fraude, plaintes, pièces de mauvaise
        qualité), motif obligatoire — CLAUDE.md §5, ajout v0.6. Le statut
        d'inscription reste "approved" ; seule la visibilité mobile est coupée.
      tags: [Admin]
      parameters:
        - name: registration
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
      responses:
        '200':
          description: Compte suspendu.
        '403':
          description: Réservé aux administrateurs, compte pas encore validé, ou déjà suspendu.
        '422':
          description: Motif manquant.

  /admin/registrations/{registration}/reactivate:
    post:
      summary: Réactive un compte suspendu (aucun motif requis) — CLAUDE.md §5, ajout v0.6.
      tags: [Admin]
      parameters:
        - name: registration
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Compte réactivé.
        '403':
          description: Réservé aux administrateurs, ou compte pas suspendu.

  /admin/garages:
    get:
      summary: Liste tous les garages, validés ou non (supervision admin).
      tags: [Admin]
      responses:
        '200':
          description: Liste paginée.

  /admin/garages/{garage}:
    get:
      summary: Détail d'un garage (supervision admin).
      tags: [Admin]
      parameters:
        - name: garage
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK

  /admin/products:
    get:
      summary: Liste les produits (mini-boutique Garage ou Market Space), tous statuts.
      tags: [Admin]
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [pending, approved, rejected]}
      responses:
        '200':
          description: Liste paginée.
        '403':
          description: Réservé aux administrateurs.

  /admin/products/{product}:
    get:
      summary: Détail d'un produit (supervision admin).
      tags: [Admin]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK

  /admin/products/{product}/approve:
    post:
      summary: Valide un produit en attente (CLAUDE.md §5, règle 5).
      tags: [Admin]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Produit validé.
        '403':
          description: Réservé aux administrateurs, ou produit déjà traité.

  /admin/products/{product}/reject:
    post:
      summary: Rejette un produit en attente, avec motif obligatoire.
      tags: [Admin]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
      responses:
        '200':
          description: Produit rejeté.
        '422':
          description: Motif manquant.

  /admin/services:
    get:
      summary: Liste les services de réparation, tous garages et statuts confondus.
      tags: [Admin]
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [pending, approved, rejected]}
      responses:
        '200':
          description: Liste paginée.
        '403':
          description: Réservé aux administrateurs.

  /admin/services/{service}:
    get:
      summary: Détail d'un service (supervision admin).
      tags: [Admin]
      parameters:
        - name: service
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK

  /admin/services/{service}/approve:
    post:
      summary: Valide un service en attente (CLAUDE.md §5, règle 5).
      tags: [Admin]
      parameters:
        - name: service
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Service validé.
        '403':
          description: Réservé aux administrateurs, ou service déjà traité.

  /admin/services/{service}/reject:
    post:
      summary: Rejette un service en attente, avec motif obligatoire.
      tags: [Admin]
      parameters:
        - name: service
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
      responses:
        '200':
          description: Service rejeté.
        '422':
          description: Motif manquant.

  /garage/profile:
    get:
      summary: >
        Profil du garage du compte Garagiste authentifié. Créé automatiquement
        à l'approbation du dossier KYC (voir /admin/registrations/{id}/approve) ;
        404 tant que le compte n'est pas encore validé.
      tags: [Garage]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Garage'
        '404':
          description: Profil pas encore créé (compte non validé).
    put:
      summary: Met à jour le profil du garage (nom, adresse, géoloc, téléphone).
      tags: [Garage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address]
              properties:
                name: {type: string}
                description: {type: string, nullable: true}
                address: {type: string}
                latitude: {type: number, nullable: true}
                longitude: {type: number, nullable: true}
                phone: {type: string, nullable: true}
      responses:
        '200':
          description: Profil mis à jour.

  /garage/profile/opening-hours:
    put:
      summary: Remplace intégralement les horaires d'ouverture (7 jours requis).
      tags: [Garage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hours]
              properties:
                hours:
                  type: array
                  minItems: 7
                  maxItems: 7
                  items:
                    type: object
                    required: [day_of_week, is_closed]
                    properties:
                      day_of_week: {type: integer, minimum: 1, maximum: 7}
                      is_closed: {type: boolean}
                      opens_at: {type: string, nullable: true, example: "08:00"}
                      closes_at: {type: string, nullable: true, example: "18:00"}
      responses:
        '200':
          description: Horaires mis à jour.
        '422':
          description: Jour manquant, ou horaires incohérents (fermeture avant ouverture).

  /garage/profile/images:
    post:
      summary: Ajoute une ou plusieurs photos du garage.
      tags: [Garage]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  items: {type: string, format: binary}
      responses:
        '201':
          description: Photo(s) ajoutée(s).

  /garage/profile/images/{image}:
    delete:
      summary: Supprime une photo du garage (doit appartenir au garage authentifié).
      tags: [Garage]
      parameters:
        - name: image
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Photo supprimée.
        '404':
          description: Photo introuvable ou appartenant à un autre garage.

  /garage/products:
    get:
      summary: Catalogue de la mini-boutique du garage authentifié (tous statuts).
      tags: [Garage]
      responses:
        '200':
          description: Liste paginée.
    post:
      summary: Ajoute un produit à la mini-boutique — en attente de validation admin (CLAUDE.md §5, règle 5).
      tags: [Garage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price, stock_quantity]
              properties:
                name: {type: string}
                description: {type: string, nullable: true}
                sku: {type: string, nullable: true}
                price: {type: number}
                stock_quantity: {type: integer}
      responses:
        '201':
          description: Produit créé, statut "pending".

  /garage/products/{product}:
    put:
      summary: Met à jour un produit de la mini-boutique — repasse en "pending" (CLAUDE.md §5, règle 5).
      tags: [Garage]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price]
              properties:
                name: {type: string}
                description: {type: string, nullable: true}
                sku: {type: string, nullable: true}
                price: {type: number}
      responses:
        '200':
          description: Produit mis à jour.
        '404':
          description: Produit introuvable ou appartenant à un autre garage.
    delete:
      summary: Supprime un produit de la mini-boutique.
      tags: [Garage]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Produit supprimé.

  /garage/products/{product}/stock:
    put:
      summary: >
        Corrige la quantité en stock d'un produit — ne touche pas au statut de
        validation admin (correction de quantité, pas remise en cause du produit).
      tags: [Garage]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stock_quantity]
              properties:
                stock_quantity: {type: integer}
      responses:
        '200':
          description: Stock mis à jour.

  /garage/services:
    get:
      summary: Catalogue des services de réparation du garage authentifié (tous statuts).
      tags: [Garage]
      responses:
        '200':
          description: Liste paginée.
    post:
      summary: Ajoute un service de réparation — en attente de validation admin (CLAUDE.md §5, règle 5).
      tags: [Garage]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, description, category, price, duration_minutes]
              properties:
                name: {type: string}
                description: {type: string, maxLength: 500}
                category:
                  type: string
                  enum: [entretien_courant, freinage_suspension, pneumatiques, electricite_electronique, climatisation_refroidissement, carrosserie, diagnostic_controle, autre_divers]
                price: {type: number}
                duration_minutes: {type: integer}
                image: {type: string, format: binary}
      responses:
        '201':
          description: Service créé, statut "pending".

  /garage/services/{service}:
    put:
      summary: Met à jour un service (contenu) — repasse en "pending" (CLAUDE.md §5, règle 5).
      tags: [Garage]
      parameters:
        - name: service
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, description, category, price, duration_minutes]
              properties:
                name: {type: string}
                description: {type: string, maxLength: 500}
                category:
                  type: string
                  enum: [entretien_courant, freinage_suspension, pneumatiques, electricite_electronique, climatisation_refroidissement, carrosserie, diagnostic_controle, autre_divers]
                price: {type: number}
                duration_minutes: {type: integer}
                image: {type: string, format: binary}
      responses:
        '200':
          description: Service mis à jour.
        '404':
          description: Service introuvable ou appartenant à un autre garage.
    delete:
      summary: Supprime un service.
      tags: [Garage]
      parameters:
        - name: service
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Service supprimé.

  /garage/services/{service}/availability:
    put:
      summary: >
        Active/désactive la disponibilité du service — ne touche pas au statut
        de validation admin (CLAUDE.md §5, ajout v0.6).
      tags: [Garage]
      parameters:
        - name: service
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active: {type: boolean}
      responses:
        '200':
          description: Disponibilité mise à jour.

  /market-space/products:
    get:
      summary: Catalogue du compte Market Space authentifié (tous statuts).
      tags: [MarketSpace]
      responses:
        '200':
          description: Liste paginée.
    post:
      summary: Ajoute un produit — en attente de validation admin (CLAUDE.md §5, règle 5).
      tags: [MarketSpace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price, stock_quantity]
              properties:
                name: {type: string}
                description: {type: string, nullable: true}
                sku: {type: string, nullable: true}
                price: {type: number}
                stock_quantity: {type: integer}
      responses:
        '201':
          description: Produit créé, statut "pending".

  /market-space/products/{product}:
    put:
      summary: Met à jour un produit — repasse en "pending" (CLAUDE.md §5, règle 5).
      tags: [MarketSpace]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price]
              properties:
                name: {type: string}
                description: {type: string, nullable: true}
                sku: {type: string, nullable: true}
                price: {type: number}
      responses:
        '200':
          description: Produit mis à jour.
        '404':
          description: Produit introuvable ou appartenant à un autre compte Market Space.
    delete:
      summary: Supprime un produit.
      tags: [MarketSpace]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Produit supprimé.

  /market-space/products/{product}/stock:
    put:
      summary: Corrige la quantité en stock — ne touche pas au statut de validation admin.
      tags: [MarketSpace]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stock_quantity]
              properties:
                stock_quantity: {type: integer}
      responses:
        '200':
          description: Stock mis à jour.

  /mobile/garages:
    get:
      summary: >
        Liste les garages visibles publiquement (compte validé uniquement).
        Recherche géographique par proximité : module à part, non couvert ici
        (voir CLAUDE.md §7).
      tags: [Mobile]
      security: []
      responses:
        '200':
          description: Liste paginée.

  /mobile/garages/{garage}:
    get:
      summary: >
        Détail public d'un garage, avec sa mini-boutique ("products", produits
        "approved" uniquement) et ses services ("services", "approved" ET actifs
        uniquement) — CLAUDE.md §5, ajouts v0.4 et v0.6.
      tags: [Mobile]
      security: []
      parameters:
        - name: garage
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK
        '404':
          description: Garage inexistant, compte non validé, ou suspendu (CLAUDE.md §5, ajout v0.6).

  /mobile/market-space-accounts:
    get:
      summary: Liste les boutiques Market Space visibles publiquement (compte validé, non suspendu).
      tags: [Mobile]
      security: []
      responses:
        '200':
          description: Liste paginée.

  /mobile/market-space-accounts/{marketSpaceAccount}:
    get:
      summary: Détail public d'une boutique Market Space, avec son catalogue approuvé.
      tags: [Mobile]
      security: []
      parameters:
        - name: marketSpaceAccount
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK
        '404':
          description: Boutique inexistante, compte non validé, ou suspendu (CLAUDE.md §5, ajout v0.6).

