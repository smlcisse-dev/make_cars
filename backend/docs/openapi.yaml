openapi: 3.0.3
info:
  title: Make Cars API
  description: >
    API REST unique consommée par la SPA web (Admin / Garagiste / Market Space)
    et par l'application mobile Flutter (automobilistes). Voir /CLAUDE.md à la
    racine du projet pour le contexte métier et les règles de gestion.
  version: 0.3.0

servers:
  - url: http://localhost:8000/api
    description: Développement local

tags:
  - name: Auth
    description: Inscription, connexion, gestion des tokens (Laravel Sanctum).
  - name: Admin
    description: Endpoints réservés au dashboard Administrateur.
  - name: Garage
    description: Endpoints du dashboard Garagiste (compte Garagiste requis).
  - name: MarketSpace
    description: Endpoints du dashboard Market Space (compte Market Space requis).
  - name: Mobile
    description: Endpoints consommés par l'application mobile (automobilistes).

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
      description: "Token d'API Laravel Sanctum, envoyé en en-tête Authorization: Bearer <token>."

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [automobiliste, garagiste, market_space, admin]
        role_label:
          type: string
        professional_registration:
          $ref: '#/components/schemas/ProfessionalRegistration'

    ProfessionalRegistration:
      type: object
      nullable: true
      properties:
        id:
          type: integer
        structure_name:
          type: string
        address:
          type: string
        business_registration_number:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        rejection_reason:
          type: string
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        documents:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              type:
                type: string
                enum: [business_registration, premises_photo]
              download_url:
                type: string
        created_at:
          type: string
          format: date-time
        is_suspended:
          type: boolean
          description: >
            Compte déjà approuvé mais suspendu par un admin (fraude, plaintes,
            pièces de mauvaise qualité) — invisible côté mobile tant que suspendu,
            réversible (CLAUDE.md §5, ajout v0.6). N'affecte pas "status" ci-dessus.
        suspension_reason:
          type: string
          nullable: true
        suspended_at:
          type: string
          format: date-time
          nullable: true

    AuthPayload:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            token:
              type: string
        message:
          type: string

    Garage:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: string, nullable: true}
        address: {type: string}
        latitude: {type: number, format: float, nullable: true}
        longitude: {type: number, format: float, nullable: true}
        phone: {type: string, nullable: true}
        is_publicly_visible:
          type: boolean
          description: Reflète la validation admin du compte Garagiste (CLAUDE.md §5 règle 4), pas un champ propre au garage.
        opening_hours:
          type: array
          items:
            type: object
            properties:
              day_of_week: {type: integer, minimum: 1, maximum: 7, description: "ISO-8601 : 1 = lundi ... 7 = dimanche"}
              day_label: {type: string}
              is_closed: {type: boolean}
              opens_at: {type: string, nullable: true, example: "08:00"}
              closes_at: {type: string, nullable: true, example: "18:00"}
        images:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              url: {type: string}
              position: {type: integer}
        products:
          type: array
          items: {$ref: '#/components/schemas/Product'}
          description: Mini-boutique du garage — uniquement les produits "approved" hors dashboard Garagiste (CLAUDE.md §5, ajout v0.4).
        services:
          type: array
          items: {$ref: '#/components/schemas/Service'}
          description: Uniquement les services "approved" et actifs hors dashboard Garagiste (CLAUDE.md §5, ajout v0.6).

    MarketSpaceAccount:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: string, nullable: true}
        address: {type: string}
        phone: {type: string, nullable: true}
        is_publicly_visible:
          type: boolean
          description: Reflète la validation admin ET l'absence de suspension du compte Market Space (CLAUDE.md §5 règle 4, ajout v0.6).
        products:
          type: array
          items: {$ref: '#/components/schemas/Product'}

    Product:
      type: object
      description: >
        Un seul vendeur par produit : mini-boutique Garage OU Market Space,
        jamais les deux (relation polymorphe côté backend — CLAUDE.md §5, ajout v0.4).
      properties:
        id: {type: integer}
        sellable_type: {type: string, enum: [garage, market_space]}
        sellable_id: {type: integer}
        name: {type: string}
        description: {type: string, nullable: true}
        sku: {type: string, nullable: true}
        price: {type: string, description: "Décimal sérialisé en chaîne, ex. \"15000.00\"."}
        stock_quantity: {type: integer}
        status: {type: string, enum: [pending, approved, rejected]}
        rejection_reason: {type: string, nullable: true}
        is_publicly_visible:
          type: boolean
          description: "status == approved ET compte vendeur validé/non suspendu."
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    Service:
      type: object
      description: >
        Service de réparation, toujours rattaché à un Garage (jamais au Market
        Space), prix fixe unique — CLAUDE.md §5, ajout v0.6.
      properties:
        id: {type: integer}
        garage_id: {type: integer}
        name: {type: string}
        description: {type: string}
        category:
          type: string
          enum: [entretien_courant, freinage_suspension, pneumatiques, electricite_electronique, climatisation_refroidissement, carrosserie, diagnostic_controle, autre_divers]
        category_label: {type: string}
        price: {type: string, description: "Décimal sérialisé en chaîne, ex. \"15000.00\"."}
        duration_minutes: {type: integer}
        image_url: {type: string, nullable: true}
        is_active:
          type: boolean
          description: Disponibilité gérée par le garagiste, distincte de "status" (validation admin) — CLAUDE.md §5, ajout v0.6.
        status: {type: string, enum: [pending, approved, rejected]}
        rejection_reason: {type: string, nullable: true}
        is_publicly_visible:
          type: boolean
          description: "status == approved ET is_active == true ET garage validé/non suspendu."
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    Appointment:
      type: object
      description: >
        Premier maillon de la chaîne RDV → devis → validation → prestation →
        paiement → facture (CLAUDE.md §5 règle 10, ajout v0.7). Ne déclenche
        jamais de paiement.
      properties:
        id: {type: integer}
        garage_id: {type: integer}
        user_id: {type: integer, description: Automobiliste demandeur.}
        repair_service_id: {type: integer, nullable: true}
        description: {type: string, nullable: true}
        requested_at:
          type: string
          format: date-time
          description: Date/heure initialement proposée par l'automobiliste.
        proposed_at:
          type: string
          format: date-time
          nullable: true
          description: Contre-proposition du garagiste (statut "rescheduled" uniquement).
        confirmed_at:
          type: string
          format: date-time
          nullable: true
          description: Date/heure retenue une fois le RDV "confirmed" (= requested_at ou proposed_at accepté).
        status:
          type: string
          enum: [pending, confirmed, rejected, rescheduled, cancelled, completed]
          description: "\"completed\" est déclenché par le module Devis (mark-paid ou abandon — CLAUDE.md §5, ajout v0.8), dans les deux cas de clôture."
        rejection_reason: {type: string, nullable: true}
        garage: {$ref: '#/components/schemas/Garage'}
        repair_service: {$ref: '#/components/schemas/Service'}
        user: {$ref: '#/components/schemas/User'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    QuoteLine:
      type: object
      description: >
        Libellé et prix figés au moment de l'ajout (snapshot) — jamais
        recalculés depuis le catalogue après coup (CLAUDE.md §5, ajout v0.8).
      properties:
        id: {type: integer}
        type: {type: string, enum: [diagnosis_fee, service, product]}
        repair_service_id: {type: integer, nullable: true}
        product_id: {type: integer, nullable: true}
        label: {type: string}
        unit_price: {type: string, description: "Décimal sérialisé en chaîne."}
        quantity: {type: integer}
        line_total: {type: string, description: "Décimal sérialisé en chaîne."}

    QuoteVersion:
      type: object
      description: >
        Instantané figé d'un tour de négociation — chaque version a son
        propre PDF, jamais réécrit (CLAUDE.md §5, ajout v0.8).
      properties:
        id: {type: integer}
        quote_id: {type: integer}
        version: {type: integer}
        document_type: {type: string, enum: [quote, invoice]}
        is_sent: {type: boolean, description: "false = brouillon, encore modifiable."}
        sent_at: {type: string, format: date-time, nullable: true}
        decision: {type: string, enum: [accepted, rejected], nullable: true}
        decided_at: {type: string, format: date-time, nullable: true}
        total: {type: string, description: "Somme des lignes, décimal sérialisé en chaîne."}
        lines:
          type: array
          items: {$ref: '#/components/schemas/QuoteLine'}
        created_at: {type: string, format: date-time}

    Quote:
      type: object
      description: >
        Deuxième maillon de la chaîne RDV → devis → validation → prestation
        → paiement → facture (CLAUDE.md §5 règle 10, ajout v0.8). Un seul
        Quote par Appointment ; la renégociation crée des QuoteVersion.
      properties:
        id: {type: integer}
        appointment_id: {type: integer}
        status:
          type: string
          enum: [draft, sent, accepted, rejected, negotiating, in_progress, invoiced, abandoned]
        paid_at: {type: string, format: date-time, nullable: true}
        versions:
          type: array
          items: {$ref: '#/components/schemas/QuoteVersion'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    Message:
      type: object
      properties:
        id: {type: integer}
        conversation_id: {type: integer}
        is_system:
          type: boolean
          description: "true pour un message posté automatiquement (devis/facture générés) — sender est alors null."
        sender: {$ref: '#/components/schemas/User'}
        body: {type: string, nullable: true}
        has_image: {type: boolean}
        attachment_type:
          type: string
          nullable: true
          enum: [quote_pdf]
          description: Message système avec devis/facture en pièce jointe (téléchargée via l'endpoint devis, pas dupliquée).
        quote_version_id: {type: integer, nullable: true}
        created_at: {type: string, format: date-time}

    Conversation:
      type: object
      description: >
        Tous les échanges entre UN garage et UN automobiliste, indépendamment
        de tout RDV précis — un seul canal par paire (CLAUDE.md §5, ajout v0.8).
      properties:
        id: {type: integer}
        garage_id: {type: integer}
        user_id: {type: integer}
        last_message_at: {type: string, format: date-time, nullable: true}
        garage: {$ref: '#/components/schemas/Garage'}
        user: {$ref: '#/components/schemas/User'}
        messages:
          type: array
          items: {$ref: '#/components/schemas/Message'}

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Vérifie que l'API est disponible.
      tags: [Auth]
      security: []
      responses:
        '200':
          description: L'API répond correctement.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  app:
                    type: string

  /auth/register/automobiliste:
    post:
      summary: Inscription d'un automobiliste (aucune validation admin requise).
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: {type: string}
                email: {type: string}
                phone: {type: string, nullable: true}
                password: {type: string}
                password_confirmation: {type: string}
      responses:
        '201':
          description: Compte créé, token émis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
        '422':
          description: Erreur de validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register/professionnel:
    post:
      summary: >
        Inscription d'un compte Garagiste ou Market Space avec justificatifs.
        Le compte est créé immédiatement (token émis) mais reste en attente de
        validation admin — aucun service/produit ne sera publiable tant que le
        statut n'est pas "approved" (CLAUDE.md §5, règle 4).
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name, email, password, password_confirmation, account_type
                - structure_name, address, business_registration_number
                - business_registration_document, premises_photos
              properties:
                name: {type: string}
                email: {type: string}
                phone: {type: string, nullable: true}
                password: {type: string}
                password_confirmation: {type: string}
                account_type: {type: string, enum: [garagiste, market_space]}
                structure_name: {type: string}
                address: {type: string}
                business_registration_number: {type: string}
                business_registration_document: {type: string, format: binary}
                premises_photos:
                  type: array
                  items: {type: string, format: binary}
      responses:
        '201':
          description: Dossier créé, en attente de validation admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
        '422':
          description: Erreur de validation.

  /auth/login:
    post:
      summary: Connexion (tout type de compte).
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string}
                password: {type: string}
      responses:
        '200':
          description: Connexion réussie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
        '422':
          description: Identifiants invalides.

  /auth/login/google:
    post:
      summary: >
        Connexion Google — réservée aux automobilistes (CLAUDE.md §5, ajout
        v0.5). Flux mobile natif : l'app Flutter fait le Google Sign-In
        elle-même et transmet l'ID token ici, pas de redirection navigateur.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token:
                  type: string
                  description: ID token (JWT) renvoyé par le SDK Google Sign-In côté app.
      responses:
        '200':
          description: Connexion réussie (compte automobiliste créé au besoin).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
        '422':
          description: >
            Jeton invalide/expiré/mal destiné, email non vérifié, ou email
            déjà utilisé par un compte professionnel (jamais rattaché à Google).

  /auth/me:
    get:
      summary: Profil de l'utilisateur authentifié.
      tags: [Auth]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'

  /auth/logout:
    post:
      summary: Révoque le token courant.
      tags: [Auth]
      responses:
        '200':
          description: Déconnexion réussie.

  /admin/registrations:
    get:
      summary: Liste les dossiers d'inscription professionnelle (admin uniquement).
      tags: [Admin]
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [pending, approved, rejected]}
      responses:
        '200':
          description: Liste paginée (enveloppe standard Laravel data/links/meta).
        '403':
          description: Réservé aux administrateurs.

  /admin/registrations/{registration}:
    get:
      summary: Détail d'un dossier d'inscription.
      tags: [Admin]
      parameters:
        - name: registration
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK
        '403':
          description: Non autorisé (ni admin, ni propriétaire du dossier).

  /admin/registrations/{registration}/documents/{document}:
    get:
      summary: Télécharge un justificatif KYC (registre de commerce ou photo du local).
      tags: [Admin]
      parameters:
        - name: registration
          in: path
          required: true
          schema: {type: integer}
        - name: document
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Fichier binaire du justificatif.
        '403':
          description: Non autorisé (ni admin, ni propriétaire du dossier).
        '404':
          description: Document introuvable ou n'appartenant pas à ce dossier.

  /admin/registrations/{registration}/approve:
    post:
      summary: Valide un dossier en attente (CLAUDE.md §5, règle 4).
      tags: [Admin]
      parameters:
        - name: registration
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Dossier validé.
        '403':
          description: Réservé aux administrateurs, ou dossier déjà traité.

  /admin/registrations/{registration}/reject:
    post:
      summary: Rejette un dossier en attente, avec motif obligatoire.
      tags: [Admin]
      parameters:
        - name: registration
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
      responses:
        '200':
          description: Dossier rejeté.
        '422':
          description: Motif manquant.

  /admin/registrations/{registration}/suspend:
    post:
      summary: >
        Suspend un compte déjà validé (fraude, plaintes, pièces de mauvaise
        qualité), motif obligatoire — CLAUDE.md §5, ajout v0.6. Le statut
        d'inscription reste "approved" ; seule la visibilité mobile est coupée.
      tags: [Admin]
      parameters:
        - name: registration
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
      responses:
        '200':
          description: Compte suspendu.
        '403':
          description: Réservé aux administrateurs, compte pas encore validé, ou déjà suspendu.
        '422':
          description: Motif manquant.

  /admin/registrations/{registration}/reactivate:
    post:
      summary: Réactive un compte suspendu (aucun motif requis) — CLAUDE.md §5, ajout v0.6.
      tags: [Admin]
      parameters:
        - name: registration
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Compte réactivé.
        '403':
          description: Réservé aux administrateurs, ou compte pas suspendu.

  /admin/garages:
    get:
      summary: Liste tous les garages, validés ou non (supervision admin).
      tags: [Admin]
      responses:
        '200':
          description: Liste paginée.

  /admin/garages/{garage}:
    get:
      summary: Détail d'un garage (supervision admin).
      tags: [Admin]
      parameters:
        - name: garage
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK

  /admin/products:
    get:
      summary: Liste les produits (mini-boutique Garage ou Market Space), tous statuts.
      tags: [Admin]
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [pending, approved, rejected]}
      responses:
        '200':
          description: Liste paginée.
        '403':
          description: Réservé aux administrateurs.

  /admin/products/{product}:
    get:
      summary: Détail d'un produit (supervision admin).
      tags: [Admin]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK

  /admin/products/{product}/approve:
    post:
      summary: Valide un produit en attente (CLAUDE.md §5, règle 5).
      tags: [Admin]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Produit validé.
        '403':
          description: Réservé aux administrateurs, ou produit déjà traité.

  /admin/products/{product}/reject:
    post:
      summary: Rejette un produit en attente, avec motif obligatoire.
      tags: [Admin]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
      responses:
        '200':
          description: Produit rejeté.
        '422':
          description: Motif manquant.

  /admin/services:
    get:
      summary: Liste les services de réparation, tous garages et statuts confondus.
      tags: [Admin]
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [pending, approved, rejected]}
      responses:
        '200':
          description: Liste paginée.
        '403':
          description: Réservé aux administrateurs.

  /admin/services/{service}:
    get:
      summary: Détail d'un service (supervision admin).
      tags: [Admin]
      parameters:
        - name: service
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK

  /admin/services/{service}/approve:
    post:
      summary: Valide un service en attente (CLAUDE.md §5, règle 5).
      tags: [Admin]
      parameters:
        - name: service
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Service validé.
        '403':
          description: Réservé aux administrateurs, ou service déjà traité.

  /admin/services/{service}/reject:
    post:
      summary: Rejette un service en attente, avec motif obligatoire.
      tags: [Admin]
      parameters:
        - name: service
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
      responses:
        '200':
          description: Service rejeté.
        '422':
          description: Motif manquant.

  /admin/appointments:
    get:
      summary: >
        Liste tous les RDV, tous garages confondus — supervision en lecture
        seule (CLAUDE.md §5 règle 8, ajout v0.7). Aucune action de
        confirmation/refus/reprogrammation côté admin.
      tags: [Admin]
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [pending, confirmed, rejected, rescheduled, cancelled, completed]}
        - name: garage_id
          in: query
          schema: {type: integer}
      responses:
        '200':
          description: Liste paginée.
        '403':
          description: Réservé aux administrateurs.

  /admin/appointments/{appointment}:
    get:
      summary: Détail d'un RDV (supervision admin).
      tags: [Admin]
      parameters:
        - name: appointment
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK

  /admin/quotes:
    get:
      summary: Liste tous les devis/factures, tous garages et statuts confondus — supervision en lecture seule (CLAUDE.md §5 règle 8, ajout v0.8).
      tags: [Admin]
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [draft, sent, accepted, rejected, negotiating, in_progress, invoiced, abandoned]}
      responses:
        '200':
          description: Liste paginée.

  /admin/quotes/{quote}:
    get:
      summary: Détail d'un devis (supervision admin), avec toutes ses versions et lignes.
      tags: [Admin]
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK

  /admin/conversations:
    get:
      summary: Liste toutes les conversations — supervision en lecture seule (CLAUDE.md §5 règle 8, ajout v0.8).
      tags: [Admin]
      responses:
        '200':
          description: Liste paginée, triée par dernier message.

  /admin/conversations/{conversation}:
    get:
      summary: Détail d'une conversation (supervision admin), avec tous ses messages.
      tags: [Admin]
      parameters:
        - name: conversation
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK

  /garage/profile:
    get:
      summary: >
        Profil du garage du compte Garagiste authentifié. Créé automatiquement
        à l'approbation du dossier KYC (voir /admin/registrations/{id}/approve) ;
        404 tant que le compte n'est pas encore validé.
      tags: [Garage]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Garage'
        '404':
          description: Profil pas encore créé (compte non validé).
    put:
      summary: Met à jour le profil du garage (nom, adresse, géoloc, téléphone).
      tags: [Garage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address]
              properties:
                name: {type: string}
                description: {type: string, nullable: true}
                address: {type: string}
                latitude: {type: number, nullable: true}
                longitude: {type: number, nullable: true}
                phone: {type: string, nullable: true}
      responses:
        '200':
          description: Profil mis à jour.

  /garage/profile/opening-hours:
    put:
      summary: Remplace intégralement les horaires d'ouverture (7 jours requis).
      tags: [Garage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hours]
              properties:
                hours:
                  type: array
                  minItems: 7
                  maxItems: 7
                  items:
                    type: object
                    required: [day_of_week, is_closed]
                    properties:
                      day_of_week: {type: integer, minimum: 1, maximum: 7}
                      is_closed: {type: boolean}
                      opens_at: {type: string, nullable: true, example: "08:00"}
                      closes_at: {type: string, nullable: true, example: "18:00"}
      responses:
        '200':
          description: Horaires mis à jour.
        '422':
          description: Jour manquant, ou horaires incohérents (fermeture avant ouverture).

  /garage/profile/images:
    post:
      summary: Ajoute une ou plusieurs photos du garage.
      tags: [Garage]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  items: {type: string, format: binary}
      responses:
        '201':
          description: Photo(s) ajoutée(s).

  /garage/profile/images/{image}:
    delete:
      summary: Supprime une photo du garage (doit appartenir au garage authentifié).
      tags: [Garage]
      parameters:
        - name: image
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Photo supprimée.
        '404':
          description: Photo introuvable ou appartenant à un autre garage.

  /garage/products:
    get:
      summary: Catalogue de la mini-boutique du garage authentifié (tous statuts).
      tags: [Garage]
      responses:
        '200':
          description: Liste paginée.
    post:
      summary: Ajoute un produit à la mini-boutique — en attente de validation admin (CLAUDE.md §5, règle 5).
      tags: [Garage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price, stock_quantity]
              properties:
                name: {type: string}
                description: {type: string, nullable: true}
                sku: {type: string, nullable: true}
                price: {type: number}
                stock_quantity: {type: integer}
      responses:
        '201':
          description: Produit créé, statut "pending".

  /garage/products/{product}:
    put:
      summary: Met à jour un produit de la mini-boutique — repasse en "pending" (CLAUDE.md §5, règle 5).
      tags: [Garage]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price]
              properties:
                name: {type: string}
                description: {type: string, nullable: true}
                sku: {type: string, nullable: true}
                price: {type: number}
      responses:
        '200':
          description: Produit mis à jour.
        '404':
          description: Produit introuvable ou appartenant à un autre garage.
    delete:
      summary: Supprime un produit de la mini-boutique.
      tags: [Garage]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Produit supprimé.

  /garage/products/{product}/stock:
    put:
      summary: >
        Corrige la quantité en stock d'un produit — ne touche pas au statut de
        validation admin (correction de quantité, pas remise en cause du produit).
      tags: [Garage]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stock_quantity]
              properties:
                stock_quantity: {type: integer}
      responses:
        '200':
          description: Stock mis à jour.

  /garage/services:
    get:
      summary: Catalogue des services de réparation du garage authentifié (tous statuts).
      tags: [Garage]
      responses:
        '200':
          description: Liste paginée.
    post:
      summary: Ajoute un service de réparation — en attente de validation admin (CLAUDE.md §5, règle 5).
      tags: [Garage]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, description, category, price, duration_minutes]
              properties:
                name: {type: string}
                description: {type: string, maxLength: 500}
                category:
                  type: string
                  enum: [entretien_courant, freinage_suspension, pneumatiques, electricite_electronique, climatisation_refroidissement, carrosserie, diagnostic_controle, autre_divers]
                price: {type: number}
                duration_minutes: {type: integer}
                image: {type: string, format: binary}
      responses:
        '201':
          description: Service créé, statut "pending".

  /garage/services/{service}:
    put:
      summary: Met à jour un service (contenu) — repasse en "pending" (CLAUDE.md §5, règle 5).
      tags: [Garage]
      parameters:
        - name: service
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, description, category, price, duration_minutes]
              properties:
                name: {type: string}
                description: {type: string, maxLength: 500}
                category:
                  type: string
                  enum: [entretien_courant, freinage_suspension, pneumatiques, electricite_electronique, climatisation_refroidissement, carrosserie, diagnostic_controle, autre_divers]
                price: {type: number}
                duration_minutes: {type: integer}
                image: {type: string, format: binary}
      responses:
        '200':
          description: Service mis à jour.
        '404':
          description: Service introuvable ou appartenant à un autre garage.
    delete:
      summary: Supprime un service.
      tags: [Garage]
      parameters:
        - name: service
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Service supprimé.

  /garage/services/{service}/availability:
    put:
      summary: >
        Active/désactive la disponibilité du service — ne touche pas au statut
        de validation admin (CLAUDE.md §5, ajout v0.6).
      tags: [Garage]
      parameters:
        - name: service
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active: {type: boolean}
      responses:
        '200':
          description: Disponibilité mise à jour.

  /garage/appointments:
    get:
      summary: Liste les RDV reçus par le garage authentifié (tous statuts).
      tags: [Garage]
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [pending, confirmed, rejected, rescheduled, cancelled, completed]}
      responses:
        '200':
          description: Liste paginée.

  /garage/appointments/{appointment}:
    get:
      summary: Détail d'un RDV reçu par le garage authentifié.
      tags: [Garage]
      parameters:
        - name: appointment
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK
        '404':
          description: RDV introuvable ou appartenant à un autre garage.

  /garage/appointments/{appointment}/confirm:
    post:
      summary: Confirme un RDV en attente à la date demandée (CLAUDE.md §5, ajout v0.7).
      tags: [Garage]
      parameters:
        - name: appointment
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: RDV confirmé.
        '403':
          description: RDV n'est plus en attente.
        '404':
          description: RDV introuvable ou appartenant à un autre garage.

  /garage/appointments/{appointment}/reject:
    post:
      summary: Refuse un RDV en attente — motif optionnel (CLAUDE.md §5, ajout v0.7).
      tags: [Garage]
      parameters:
        - name: appointment
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, nullable: true}
      responses:
        '200':
          description: RDV refusé.
        '403':
          description: RDV n'est plus en attente.

  /garage/appointments/{appointment}/reschedule:
    post:
      summary: >
        Propose une autre date pour un RDV en attente (statut "rescheduled",
        en attente de la réponse du client) — CLAUDE.md §5, ajout v0.7.
      tags: [Garage]
      parameters:
        - name: appointment
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proposed_at]
              properties:
                proposed_at: {type: string, format: date-time}
      responses:
        '200':
          description: Nouvelle date proposée.
        '403':
          description: RDV n'est plus en attente.
        '422':
          description: Date manquante ou dans le passé.

  /garage/appointments/{appointment}/quote:
    post:
      summary: >
        Crée un devis en brouillon pour un RDV confirmé (diagnostic effectué
        sur place) — un seul devis par RDV (CLAUDE.md §5, ajout v0.8).
      tags: [Garage]
      parameters:
        - name: appointment
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [type, quantity]
                    properties:
                      type: {type: string, enum: [diagnosis_fee, service, product]}
                      repair_service_id: {type: integer, description: "Requis si type=service."}
                      product_id: {type: integer, description: "Requis si type=product."}
                      label: {type: string, description: "Requis si type=diagnosis_fee (sinon repris du catalogue)."}
                      unit_price: {type: number, description: "Requis si type=diagnosis_fee (sinon repris du catalogue, jamais accepté du client pour service/product)."}
                      quantity: {type: integer, minimum: 1}
      responses:
        '201':
          description: Devis créé en brouillon.
        '403':
          description: RDV pas confirmé, ou devis déjà existant pour ce RDV.
        '422':
          description: Ligne invalide, ou stock insuffisant pour une ligne produit.
    get:
      summary: Consulte le devis d'un RDV (garagiste propriétaire).
      tags: [Garage]
      parameters:
        - name: appointment
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK
        '404':
          description: Pas de devis pour ce RDV, ou RDV appartenant à un autre garage.

  /garage/quotes/{quote}/versions/{version}:
    put:
      summary: Modifie les lignes d'une version encore en brouillon (pas envoyée) — CLAUDE.md §5, ajout v0.8.
      tags: [Garage]
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
        - name: version
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  items: {type: object}
      responses:
        '200':
          description: Brouillon mis à jour.
        '403':
          description: Cette version a déjà été envoyée.

  /garage/quotes/{quote}/versions/{version}/send:
    post:
      summary: >
        Génère le PDF, envoie la version au client et poste un message
        système avec le PDF en pièce jointe dans la conversation
        garage/client (CLAUDE.md §5, ajout v0.8).
      tags: [Garage]
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
        - name: version
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Devis envoyé.
        '403':
          description: Cette version a déjà été envoyée.

  /garage/quotes/{quote}/versions/{version}/pdf:
    get:
      summary: Télécharge le PDF d'une version déjà envoyée.
      tags: [Garage]
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
        - name: version
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Fichier binaire du PDF.
        '404':
          description: PDF pas encore généré, ou devis appartenant à un autre garage.

  /garage/quotes/{quote}/versions:
    post:
      summary: >
        Renégociation après un refus : nouvelle version brouillon, à envoyer
        séparément via /send (CLAUDE.md §5, ajout v0.8).
      tags: [Garage]
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  items: {type: object}
      responses:
        '201':
          description: Nouvelle version créée en brouillon.
        '403':
          description: Le devis précédent n'a pas été refusé.

  /garage/quotes/{quote}/start:
    post:
      summary: Démarre la prestation après acceptation du devis par le client.
      tags: [Garage]
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Prestation démarrée.
        '403':
          description: Le devis n'a pas été validé par le client.

  /garage/quotes/{quote}/mark-paid:
    post:
      summary: >
        Paiement manuel V1 (espèces ou autre — pas encore d'agrégateur en
        ligne, CLAUDE.md §7) : génère la facture (nouveau PDF, même contenu,
        mention "Facture") et clôture le RDV avec prestation réalisée.
      tags: [Garage]
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Paiement enregistré, facture générée.
        '403':
          description: La prestation n'est pas en cours.

  /garage/quotes/{quote}/abandon:
    post:
      summary: >
        Négociation infructueuse : clôture le RDV sans prestation ni facture
        (CLAUDE.md §5, ajout v0.8) — distinct d'une clôture avec prestation
        réalisée (cf. Appointment.wasCompletedWithService côté modèle).
      tags: [Garage]
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: RDV clôturé sans suite.
        '403':
          description: Le devis n'a pas été refusé.

  /garage/conversations:
    get:
      summary: >
        Liste les conversations déjà initiées par des automobilistes avec ce
        garage — pas de création côté garage (CLAUDE.md §5, ajout v0.8).
      tags: [Garage]
      responses:
        '200':
          description: Liste paginée, triée par dernier message.

  /garage/conversations/{conversation}/messages:
    get:
      summary: Liste les messages d'une conversation du garage authentifié.
      tags: [Garage]
      parameters:
        - name: conversation
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Liste paginée.
        '404':
          description: Conversation appartenant à un autre garage.
    post:
      summary: Répond dans une conversation — texte et/ou image.
      tags: [Garage]
      parameters:
        - name: conversation
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                body: {type: string, nullable: true, maxLength: 2000}
                image: {type: string, format: binary, nullable: true}
      responses:
        '201':
          description: Message envoyé.
        '422':
          description: Ni texte ni image fournis.

  /garage/conversations/{conversation}/messages/{message}/image:
    get:
      summary: Télécharge la pièce jointe image d'un message.
      tags: [Garage]
      parameters:
        - name: conversation
          in: path
          required: true
          schema: {type: integer}
        - name: message
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Fichier binaire de l'image.
        '404':
          description: Message sans image, ou conversation appartenant à un autre garage.

  /market-space/products:
    get:
      summary: Catalogue du compte Market Space authentifié (tous statuts).
      tags: [MarketSpace]
      responses:
        '200':
          description: Liste paginée.
    post:
      summary: Ajoute un produit — en attente de validation admin (CLAUDE.md §5, règle 5).
      tags: [MarketSpace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price, stock_quantity]
              properties:
                name: {type: string}
                description: {type: string, nullable: true}
                sku: {type: string, nullable: true}
                price: {type: number}
                stock_quantity: {type: integer}
      responses:
        '201':
          description: Produit créé, statut "pending".

  /market-space/products/{product}:
    put:
      summary: Met à jour un produit — repasse en "pending" (CLAUDE.md §5, règle 5).
      tags: [MarketSpace]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price]
              properties:
                name: {type: string}
                description: {type: string, nullable: true}
                sku: {type: string, nullable: true}
                price: {type: number}
      responses:
        '200':
          description: Produit mis à jour.
        '404':
          description: Produit introuvable ou appartenant à un autre compte Market Space.
    delete:
      summary: Supprime un produit.
      tags: [MarketSpace]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Produit supprimé.

  /market-space/products/{product}/stock:
    put:
      summary: Corrige la quantité en stock — ne touche pas au statut de validation admin.
      tags: [MarketSpace]
      parameters:
        - name: product
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stock_quantity]
              properties:
                stock_quantity: {type: integer}
      responses:
        '200':
          description: Stock mis à jour.

  /mobile/garages:
    get:
      summary: >
        Liste les garages visibles publiquement (compte validé uniquement).
        Recherche géographique par proximité : module à part, non couvert ici
        (voir CLAUDE.md §7).
      tags: [Mobile]
      security: []
      responses:
        '200':
          description: Liste paginée.

  /mobile/garages/{garage}:
    get:
      summary: >
        Détail public d'un garage, avec sa mini-boutique ("products", produits
        "approved" uniquement) et ses services ("services", "approved" ET actifs
        uniquement) — CLAUDE.md §5, ajouts v0.4 et v0.6.
      tags: [Mobile]
      security: []
      parameters:
        - name: garage
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK
        '404':
          description: Garage inexistant, compte non validé, ou suspendu (CLAUDE.md §5, ajout v0.6).

  /mobile/market-space-accounts:
    get:
      summary: Liste les boutiques Market Space visibles publiquement (compte validé, non suspendu).
      tags: [Mobile]
      security: []
      responses:
        '200':
          description: Liste paginée.

  /mobile/market-space-accounts/{marketSpaceAccount}:
    get:
      summary: Détail public d'une boutique Market Space, avec son catalogue approuvé.
      tags: [Mobile]
      security: []
      parameters:
        - name: marketSpaceAccount
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK
        '404':
          description: Boutique inexistante, compte non validé, ou suspendu (CLAUDE.md §5, ajout v0.6).

  /mobile/appointments:
    get:
      summary: Liste les RDV de l'automobiliste authentifié (tous statuts).
      tags: [Mobile]
      responses:
        '200':
          description: Liste paginée.
    post:
      summary: >
        Demande un RDV auprès d'un garage — service du catalogue et/ou
        description libre, au moins l'un des deux requis. Ne déclenche aucun
        paiement (CLAUDE.md §5 règle 10, ajout v0.7).
      tags: [Mobile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [garage_id, requested_at]
              properties:
                garage_id: {type: integer}
                repair_service_id: {type: integer, nullable: true}
                description: {type: string, nullable: true, maxLength: 1000}
                requested_at: {type: string, format: date-time, description: "Doit être dans le futur."}
      responses:
        '201':
          description: RDV créé, statut "pending".
        '404':
          description: Garage introuvable/non validé, ou service introuvable pour ce garage.
        '422':
          description: Ni service ni description fournis, ou date dans le passé.

  /mobile/appointments/{appointment}:
    get:
      summary: Détail d'un RDV de l'automobiliste authentifié.
      tags: [Mobile]
      parameters:
        - name: appointment
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK
        '404':
          description: RDV introuvable ou appartenant à un autre automobiliste.

  /mobile/appointments/{appointment}/cancel:
    post:
      summary: >
        Annule un RDV (pending, confirmed, ou rescheduled) — sert aussi à
        refermer une contre-proposition du garagiste qui ne convient pas
        (CLAUDE.md §5, ajout v0.7).
      tags: [Mobile]
      parameters:
        - name: appointment
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: RDV annulé.
        '403':
          description: RDV déjà terminé/refusé/annulé, ne peut plus être annulé.

  /mobile/appointments/{appointment}/accept-reschedule:
    post:
      summary: Accepte la nouvelle date proposée par le garagiste (statut "rescheduled" uniquement).
      tags: [Mobile]
      parameters:
        - name: appointment
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: RDV confirmé à la nouvelle date.
        '403':
          description: Aucune contre-proposition en attente sur ce RDV.

  /mobile/appointments/{appointment}/quote:
    get:
      summary: Consulte le devis de son propre RDV.
      tags: [Mobile]
      parameters:
        - name: appointment
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: OK
        '404':
          description: Pas de devis pour ce RDV, ou RDV appartenant à un autre automobiliste.

  /mobile/quotes/{quote}/versions/{version}/accept:
    post:
      summary: >
        Accepte la version courante d'un devis — action digitale explicite,
        jamais déduite du chat (CLAUDE.md §5, ajout v0.8). Décrémente le
        stock des lignes de pièces.
      tags: [Mobile]
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
        - name: version
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Devis accepté.
        '403':
          description: Version pas envoyée, plus la version courante, ou devis plus en attente de décision.

  /mobile/quotes/{quote}/versions/{version}/reject:
    post:
      summary: Refuse la version courante d'un devis.
      tags: [Mobile]
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
        - name: version
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Devis refusé.
        '403':
          description: Version pas envoyée, plus la version courante, ou devis plus en attente de décision.

  /mobile/quotes/{quote}/versions/{version}/pdf:
    get:
      summary: Télécharge le PDF d'une version de son propre devis.
      tags: [Mobile]
      parameters:
        - name: quote
          in: path
          required: true
          schema: {type: integer}
        - name: version
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Fichier binaire du PDF.
        '404':
          description: PDF pas encore généré, ou devis appartenant à un autre automobiliste.

  /mobile/conversations:
    get:
      summary: Liste les conversations de l'automobiliste authentifié.
      tags: [Mobile]
      responses:
        '200':
          description: Liste paginée, triée par dernier message.
    post:
      summary: >
        Démarre (ou récupère) la conversation avec un garage — possible à
        tout moment, y compris sans RDV existant (panne d'urgence).
        Idempotent : un seul canal par paire garage/automobiliste
        (CLAUDE.md §5, ajout v0.8).
      tags: [Mobile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [garage_id]
              properties:
                garage_id: {type: integer}
      responses:
        '201':
          description: Conversation prête (créée ou déjà existante).
        '404':
          description: Garage introuvable/non validé.

  /mobile/conversations/{conversation}/messages:
    get:
      summary: Liste les messages d'une conversation de l'automobiliste authentifié.
      tags: [Mobile]
      parameters:
        - name: conversation
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Liste paginée.
        '404':
          description: Conversation appartenant à un autre automobiliste.
    post:
      summary: Envoie un message — texte et/ou image.
      tags: [Mobile]
      parameters:
        - name: conversation
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                body: {type: string, nullable: true, maxLength: 2000}
                image: {type: string, format: binary, nullable: true}
      responses:
        '201':
          description: Message envoyé.
        '422':
          description: Ni texte ni image fournis.

  /mobile/conversations/{conversation}/messages/{message}/image:
    get:
      summary: Télécharge la pièce jointe image d'un message.
      tags: [Mobile]
      parameters:
        - name: conversation
          in: path
          required: true
          schema: {type: integer}
        - name: message
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Fichier binaire de l'image.
        '404':
          description: Message sans image, ou conversation appartenant à un autre automobiliste.

# Les endpoints métier suivants (paiements en ligne, avis, notifications...)
# sont ajoutés ici au fur et à mesure de leur implémentation, module par module.
